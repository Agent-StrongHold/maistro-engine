[project]
name = "maistro-core"
version = "0.1.0"
description = "Core library for the Maistro multi-agent AI platform — memory, security, classification, routing, agents, A2A, skills, builders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
]

[project.scripts]
maistro = "maistro.cli:main"

[project.optional-dependencies]
llm = [
    "litellm>=1.60",
    "pydantic-ai>=0.1",
    "fastmcp>=2.0",
]
sandbox = [
    "docker>=7.0",
]
observability = [
    "langfuse>=2.60",
]
tui = [
    "typer>=0.12",
    "rich>=13.0",
]
all = [
    "maistro-core[llm,sandbox,observability,tui]",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro"]
