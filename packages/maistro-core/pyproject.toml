[project]
name = "maistro-core"
version = "0.1.0"
description = "Core library for the Maistro multi-agent AI platform — memory, security, classification, routing, agents, A2A, skills, builders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=24.4,<26",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "pgvector>=0.3,<1",
    "pyyaml>=6.0,<7",
    "cryptography>=48.0.1,<49",
    "argon2-cffi>=23.1,<25",
]

[project.scripts]
maistro = "maistro.cli:main"

[project.optional-dependencies]
llm = [
    "fastmcp>=2.0",
]
# The sandbox tool drives the `docker` CLI via subprocess, not the Python SDK,
# so it needs no pip dependency. Kept as an explicit (empty) extra for clarity.
sandbox = []
# Vendor-neutral tracing export. The agent tracing decorators use the OpenTelemetry
# API directly (see observability/tracing.py); installing this extra + setting an OTLP
# endpoint routes spans to any backend (Arize/Phoenix, Langfuse, Honeycomb, Jaeger).
observability = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
]
tui = [
    "typer>=0.12",
    "rich>=13.0",
]
builders = [
    "textual>=0.61",
    "anthropic>=0.28",
    "maistro-bootstrap[builders]",
]
rsi = [
    "maistro-rsi>=0.1",
]
all = [
    "maistro-core[llm,sandbox,observability,tui,builders,rsi]",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro"]
