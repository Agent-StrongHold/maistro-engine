[project]
name = "maistro-rsi"
version = "0.1.0"
description = "Resumable RSI and Evolve campaigns for arbitrary repositories in VM-grade Builders sandboxes"
requires-python = ">=3.12"
dependencies = [
    "maistro-core>=0.1",
    "maistro-evolve>=0.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.scripts]
maistro-rsi = "maistro_rsi.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_rsi"]
