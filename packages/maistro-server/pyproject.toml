[project]
name = "maistro-server"
version = "0.1.0"
description = "FastAPI server for the Maistro multi-agent AI platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "maistro-core>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-ai>=0.1",
    "fastmcp>=2.0",
    "litellm>=1.60",
    "langfuse>=2.60",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_server"]
