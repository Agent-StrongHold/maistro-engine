[project]
name = "maistro-bootstrap"
version = "0.1.0"
description = "Interactive and headless installer helper for maistro-engine feature slices and Copier templates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
builders = [
    "anthropic>=0.28",
    "textual>=0.61",
]

[project.scripts]
maistro-install = "maistro_bootstrap.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_bootstrap"]
