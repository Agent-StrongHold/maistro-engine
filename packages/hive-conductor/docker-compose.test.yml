# Full-stack compose for e2e testing.
# Usage:
#   docker compose -f docker-compose.test.yml up --build -d
#   docker compose -f docker-compose.test.yml run --rm api-tests
#   docker compose -f docker-compose.test.yml run --rm e2e-tests
#   docker compose -f docker-compose.test.yml down -v

services:
  hive:
    build:
      context: ../..
      dockerfile: packages/hive-conductor/Dockerfile
    ports:
      - "8101:8101"
    environment:
      - PYTHONUNBUFFERED=1
      - HARDWARE_PRESET=beast
      - CONDUCTOR_DATA_DIR=/tmp/conductor
    # Hive's runtime image is Chainguard/Wolfi with no curl/shell (see
    # packages/hive-conductor/Dockerfile's own HEALTHCHECK comment) — a
    # curl-based probe here overrides the image's working HEALTHCHECK with one
    # that always fails, so `hive` never reports healthy and neither
    # api-tests nor e2e-tests (both gated on `condition: service_healthy`)
    # ever starts (Codex finding on #319). Same Python probe as the image's
    # own instruction, just with this compose block's faster poll cadence.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8101/health/ready', timeout=4).status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  api-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      - HIVE_BASE_URL=http://hive:8101
    depends_on:
      hive:
        condition: service_healthy
    command: ["pytest", "tests/e2e/test_pm_workflow_api.py", "-v", "--tb=short"]
    profiles: ["test"]

  e2e-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.playwright
    environment:
      - HIVE_BASE_URL=http://hive:8101
    depends_on:
      hive:
        condition: service_healthy
    command: ["npx", "playwright", "test", "--config=tests/e2e/playwright.config.ts"]
    profiles: ["test"]
