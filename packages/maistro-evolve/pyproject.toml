[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maistro-evolve"
version = "1.0.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.0", "pyyaml>=6.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_evolve"]
