[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maistro-evolve"
version = "0.9.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.0,<3", "pyyaml>=6.0,<7", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_evolve"]
