[project]
name = "maistro-registry"
version = "0.1.0"
description = "ADR/spec registry CLI — walk, validate, lint, link-check for maistro-engine docs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.28",
]

[project.scripts]
maistro-registry = "maistro_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_registry"]
