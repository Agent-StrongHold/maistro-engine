model_list:
  # ── Local Models (Ollama on P40) ──────────────────────────────

  # Default model — local Qwen 2.5 Coder 32B on P40
  - model_name: maistro-default
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://host.docker.internal:11434

  # Tier 1 — Quick (small local model, fast responses)
  - model_name: maistro-tier-1
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434

  # Tier 2 — Standard (32B local model)
  - model_name: maistro-tier-2
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://host.docker.internal:11434

  # Tier 3 — Thorough (80B MoE, higher quality, ~10 t/s on P40)
  - model_name: maistro-tier-3
    litellm_params:
      model: ollama/qwen3-coder-next:latest
      api_base: http://host.docker.internal:11434
      temperature: 0.3

  # Tier 4 — Ultra (80B MoE, max quality settings)
  - model_name: maistro-tier-4
    litellm_params:
      model: ollama/qwen3-coder-next:latest
      api_base: http://host.docker.internal:11434
      temperature: 0.5
      num_ctx: 32768

  # ── Cloud Fallbacks (optional, if API keys are set) ──────────

  - model_name: cloud-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud-opus
    litellm_params:
      model: anthropic/claude-opus-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gemini-fallback
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  request_timeout: 300  # Local models can be slower

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
