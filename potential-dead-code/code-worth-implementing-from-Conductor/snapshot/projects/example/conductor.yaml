project_id: "example"
project_dir: "/path/to/your/repo"
obsidian_vault: "/path/to/your/obsidian-vault"
gateway_url: "http://localhost:9090"
inference_url: "http://localhost:8080"
max_retries: 3
accept_threshold: 7.0
max_working_memory_tokens: 8000
layer0_path: "./constraints.md"
training_data_dir: "./training-data"
exemplar_library_dir: "./exemplars"

toolchains:
  node:
    enabled: true
    package_manager: "npm"
  cpp:
    enabled: true
    build_system: "cmake"
  python:
    enabled: true
    package_manager: "pip"

tests:
  # Keep this simple in Phase 0: one command that returns non-zero on failure.
  # Examples:
  #   Node/npm: "npm test"
  #   Python/pytest: "pytest"
  #   C++/cmake: "ctest --test-dir build --output-on-failure"
  command: "echo 'no test command configured — edit conductor.yaml'"
