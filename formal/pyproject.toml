[project]
name = "maistro-formal-models"
version = "0.1.0"
description = "Machine-checkable security models for Maistro Engine (Hypothesis stateful property tests)"
requires-python = ">=3.12"
dependencies = [
    "hypothesis>=6.130",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

# Installed only for its dependencies; the code is imported as a namespace
# package from the repo root (python -m formal..., pytest formal/models).
# Without an explicit empty package list, setuptools auto-discovery fails on
# the multiple top-level directories (models/, extractors/, generated/).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["models"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.hypothesis]
max_examples = 100
deadline = 60000

[tool.ruff]
target-version = "py312"
line-length = 120
