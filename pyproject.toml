[project]
name = "maistro-workspace"
version = "0.0.0"
description = "Monorepo workspace root — all code lives in packages/"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",

    # Agent Framework
    "pydantic-ai>=0.1",

    # Tool Protocol
    "fastmcp>=2.0",

    # LLM Proxy
    "litellm>=1.60",

    # Observability
    "langfuse>=2.60",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",

    # Utilities
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "httpx>=0.28",
    "docker>=7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
browser = ["playwright>=1.49"]
scheduling = ["apscheduler>=3.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/maistro-core/src", "packages/maistro-server/src", "packages/maistro-turing/src", "packages/maistro-canvas/src", "src/maistro"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C90", "C4"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["packages/maistro-core/tests", "packages/maistro-server/tests", "packages/maistro-turing/tests", "packages/maistro-canvas/tests", "tests"]
asyncio_mode = "auto"
pythonpath = [
    "packages/maistro-core/src",
    "packages/maistro-server/src",
    "packages/maistro-turing/src",
    "packages/maistro-canvas/src",
    "src/maistro",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
