[project]
name = "maistro"
version = "0.1.0"
description = "Software engineering department in a box — multi-agent AI platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",

    # Agent Framework
    "pydantic-ai>=0.1",

    # Tool Protocol
    "fastmcp>=2.0",

    # LLM Proxy
    "litellm>=1.60",

    # Observability
    "langfuse>=2.60",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",

    # Browser
    "playwright>=1.49",

    # Scheduling
    "apscheduler>=3.11",

    # Utilities
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "httpx>=0.28",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
