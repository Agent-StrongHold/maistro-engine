[project]
name = "maistro-workspace"
version = "0.0.0"
description = "Monorepo workspace root — all code lives in packages/"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Tool Protocol
    "fastmcp>=2.0",
    # Observability — vendor-neutral OpenTelemetry (see maistro-core[observability])
    "opentelemetry-api>=1.30",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    # Utilities
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "bcrypt>=4.0",
    "argon2-cffi>=23.1",
    "maistro-registry",
    "temporalio>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]
browser = ["playwright>=1.49"]
scheduling = ["apscheduler>=3.11"]
# NOTE: the on-demand /code-health and /security-scan toolchains are NOT project
# extras — several (semgrep) carry transitive pins that conflict with the app's
# resolution. They are standalone CLI tools listed in requirements-dev-tools.txt;
# install with `pip install -r requirements-dev-tools.txt` (or pipx per tool).
bootstrap = [
    "maistro-bootstrap",
]

[project.scripts]
maistro-registry = "maistro_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The workspace root is a dependency-only meta package — every actual
# module lives under packages/. Tell hatchling to build an empty wheel
# rather than search for a directory matching `maistro_workspace`.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/maistro-core/src",
    "packages/maistro-server/src",
    "packages/maistro-turing/src",
    "packages/maistro-canvas/src",
    "packages/maistro-bootstrap/src",
    "packages/maistro-registry/src",
    "packages/maistro-evolve/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C90", "C4"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = [
    "packages/maistro-core/tests",
    "packages/maistro-server/tests",
    "packages/maistro-turing/tests",
    "packages/maistro-canvas/tests",
    "packages/maistro-bootstrap/tests",
    "packages/maistro-evolve/tests",
    "tests",
]
asyncio_mode = "auto"
markers = [
    "contract: ADR-032 contract axis (boundary | behavioral | cross_service)",
    "scope: test scope axis (unit | integration | e2e | property)",
]
pythonpath = [
    "packages/maistro-core/src",
    "packages/maistro-server/src",
    "packages/maistro-turing/src",
    "packages/maistro-canvas/src",
    ".",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv.sources]
maistro-bootstrap = { path = "packages/maistro-bootstrap", editable = true }
maistro-registry = { path = "packages/maistro-registry", editable = true }
