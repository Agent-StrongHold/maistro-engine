[project]
name = "maistro-workspace"
version = "0.0.0"
description = "Monorepo workspace root — all code lives in packages/"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/maistro-core/src", "packages/maistro-server/src", "packages/maistro-turing/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C90", "C4"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["packages/maistro-core/tests", "packages/maistro-server/tests", "packages/maistro-turing/tests"]
asyncio_mode = "auto"
pythonpath = [
    "packages/maistro-core/src",
    "packages/maistro-server/src",
    "packages/maistro-turing/src",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
