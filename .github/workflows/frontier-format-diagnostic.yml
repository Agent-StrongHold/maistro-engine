name: frontier format diagnostic

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-frontier-execution
      - uses: astral-sh/setup-uv@v7
      - name: Format frontier implementation and tests
        run: |
          uvx --from ruff==0.15.12 ruff format \
            packages/maistro-core/src/maistro/graph/durable_runs/frontier_executor.py \
            packages/maistro-core/src/maistro/graph/durable_runs/stores.py \
            packages/maistro-core/tests/graph/durable_runs/test_frontier_execution.py \
            packages/maistro-core/tests/graph/durable_runs/test_frontier_hitl.py
      - name: Refresh focused suite inventory count
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/testing/SUITE-INVENTORY.md')
          text = path.read_text()
          text = text.replace(
              'Real durable Graph frontier execution adds four maistro-core node IDs covering',
              'Real durable Graph frontier execution adds six maistro-core node IDs covering',
          )
          text = text.replace(
              '| `packages/maistro-core/tests` | 6137 | `ci.yml` |',
              '| `packages/maistro-core/tests` | 6139 | `ci.yml` |',
          )
          path.write_text(text)
          PY
      - name: Commit exact formatter and inventory output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/maistro-core/src/maistro/graph/durable_runs/frontier_executor.py \
            packages/maistro-core/src/maistro/graph/durable_runs/stores.py \
            packages/maistro-core/tests/graph/durable_runs/test_frontier_execution.py \
            packages/maistro-core/tests/graph/durable_runs/test_frontier_hitl.py \
            docs/testing/SUITE-INVENTORY.md
          git commit -m 'style(graph): finalize frontier execution coverage'
          git push origin HEAD:feat/graph-frontier-execution
