name: frontier format diagnostic

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-frontier-execution
      - uses: astral-sh/setup-uv@v7
      - name: Apply Ruff formatter
        run: uvx --from ruff==0.15.12 ruff format packages/maistro-core/src/maistro/graph/durable_runs/frontier_executor.py
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/maistro-core/src/maistro/graph/durable_runs/frontier_executor.py
          git commit -m 'style(graph): format frontier executor'
          git push origin HEAD:feat/graph-frontier-execution
