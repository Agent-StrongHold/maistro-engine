# Installer release plumbing (SPEC-072726-3439 Phase 5):
#   - validate the selected release ref is already contained in reviewed main,
#   - run a full installer smoke test before any production image publication,
#   - build + push pinned images to GHCR only after smoke succeeds,
#   - publish a SHA256SUMS manifest for the curl/iex entrypoints.
name: release-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  validate-release-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release commit to be contained in reviewed main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release ref $GITHUB_REF_NAME ($GITHUB_SHA) is not contained in origin/main." >&2
            echo "Promote through develop -> integration -> main before publishing." >&2
            exit 1
          fi
          echo "Release commit is contained in reviewed main history."

  smoke-linux:
    needs: validate-release-ref
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Stage disposable bootstrap credentials
        run: |
          umask 077
          cat > /tmp/smoke-credentials.json <<'EOF'
          {
            "admin_username": "smoke-admin",
            "admin_password": "smoke-admin-pass-1",
            "user_username": "smoke-user",
            "user_password": "smoke-user-pass-1",
            "optional_modules": [],
            "hardware_preset": "auto"
          }
          EOF
      - name: Run the installer headless
        env:
          MAISTRO_BOOTSTRAP_CREDENTIALS_FILE: /tmp/smoke-credentials.json
          MAISTRO_INSTALL_CLI: "0"
          MAISTRO_OPEN_BROWSER: "0"
        run: ./install.sh --answers-file docs/install/examples/answers-v1-smoke.yaml
      - name: Assert end state
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:8000/health/live >/dev/null || curl -sf http://127.0.0.1:8000/health >/dev/null
          curl -sf http://127.0.0.1:8101/health/ready >/dev/null
          status="$(curl -sf http://127.0.0.1:8101/v1/setup/status)"
          echo "$status"
          echo "$status" | grep -q '"setup_complete"[[:space:]]*:[[:space:]]*true'
          if [ -f /tmp/smoke-credentials.json ]; then
            echo "bootstrap credentials file was not shredded" >&2
            exit 1
          fi
          docker compose exec -T hive-conductor python -c "
          import pathlib, subprocess
          vault = pathlib.Path('/data/secrets.age')
          key = pathlib.Path('/data/admin.key')
          assert vault.exists() and key.exists(), 'vault not provisioned'
          out = subprocess.run(['age', '-d', '-i', str(key)], input=vault.read_bytes(), capture_output=True)
          assert out.returncode == 0, out.stderr.decode()
          print('vault round-trip OK')
          "
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100

  build-images:
    needs: [validate-release-ref, smoke-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build + push maistro-engine
        id: engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/blakematthews-dev/maistro-engine:latest
            ghcr.io/blakematthews-dev/maistro-engine:${{ github.ref_name }}
      - name: Build + push hive-conductor
        id: conductor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/hive-conductor/Dockerfile
          push: true
          tags: |
            ghcr.io/blakematthews-dev/hive-conductor:latest
            ghcr.io/blakematthews-dev/hive-conductor:${{ github.ref_name }}
      - name: Print digests for the PINNED_IMAGES map
        run: |
          {
            echo "## Pinned image digests"
            echo
            echo "Update PINNED_IMAGES in packages/maistro-bootstrap/src/maistro_bootstrap/delivery.py:"
            echo
            echo '```'
            echo "maistro-engine:  ghcr.io/blakematthews-dev/maistro-engine@${{ steps.engine.outputs.digest }}"
            echo "hive-conductor:  ghcr.io/blakematthews-dev/hive-conductor@${{ steps.conductor.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  checksums:
    needs: validate-release-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SHA256SUMS for the entrypoints
        run: |
          sha256sum get.sh get.ps1 install.sh > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: installer-checksums
          path: SHA256SUMS
          if-no-files-found: error
