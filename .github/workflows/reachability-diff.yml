name: reachability-diff

on:
  pull_request:
    branches: [develop]

jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Show reachability ratchet output
        run: python scripts/check-reachability.py
