name: Registry CI

# Validate ADR/spec front-matter per engine#ADR-031.
# Warn-only during the rollout window (until 2026-06-07);
# flip to --strict (hard fail on warnings) after day 30.

on:
  pull_request:
    branches: [integration, main]
    paths:
      - 'docs/adr/**'
      - 'docs/specs/**'
      - 'packages/maistro-registry/**'
      - 'tests/tools/registry/**'
      - 'pyproject.toml'
      - '.github/workflows/registry.yml'
  push:
    branches:
      - main
      - integration
      - research/pm-fleet-poc

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ADR/spec front-matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: pip install -e ./packages/maistro-registry pytest

      - name: Run unit tests
        run: |
          pytest tests/tools/registry/ \
            --confcutdir=tests/tools/registry \
            -p no:cacheprovider \
            -v

      - name: Validate ADR/spec front-matter (warn-only window)
        run: python -m maistro_registry.cli walk .
