name: Registry CI

# Validate ADR/spec front-matter per engine#ADR-031.
# Warn-only during the rollout window (until 2026-06-07);
# flip to --strict (hard fail on warnings) after day 30.

on:
  pull_request:
    paths:
      - 'docs/adr/**'
      - 'docs/specs/**'
      - 'specs/**'
      - 'tools/registry/**'
      - 'tests/tools/registry/**'
      - 'pyproject.toml'
      - '.github/workflows/registry.yml'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ADR/spec front-matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        # Only what the registry tool needs; keeps CI fast and the
        # supply-chain surface small per engine#ADR-039.
        # httpx is required by tools/registry/linker.py for cross-repo
        # link checking.
        run: pip install pydantic pyyaml pytest httpx

      - name: Run unit tests
        # --confcutdir prevents pytest from discovering the root
        # tests/conftest.py (which imports the engine and pulls in
        # pydantic_settings + the rest of the engine dep tree).
        # The local tests/tools/registry/conftest.py is a second guard.
        run: |
          pytest tests/tools/registry/ \
            --confcutdir=tests/tools/registry \
            -p no:cacheprovider \
            -v

      - name: Lint ADR/spec front-matter (warn-only window)
        # `lint` runs: walk + validate + DAG cycle check + local link
        # check (FilesystemResolver). Until 2026-06-07: do NOT pass
        # --strict; warnings (missing front-matter) are advisory.
        # After 2026-06-07: add --strict to fail the job on warnings.
        run: python -m tools.registry.cli lint .

      - name: Generate registry artifacts (dry-run)
        # Generate registry.json + registry.md to a tmp directory to
        # confirm the generator works end-to-end against current ADR
        # set. We don't commit the generated artifacts here; that
        # lands in [engine-002] (auto-regen on merge to main).
        run: |
          python -m tools.registry.cli generate . \
            --output /tmp/registry-dryrun \
            --allow-errors
          echo "Generated artifacts:"
          ls -la /tmp/registry-dryrun/
          echo "Entry count:"
          python -c "import json; d=json.load(open('/tmp/registry-dryrun/registry.json')); print(len(d), 'entries')"
