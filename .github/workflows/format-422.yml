name: format-422

on:
  push:
    branches: [feat/attempt-result-acceptance]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attempt-result-acceptance
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - name: Apply pinned Ruff formatting and remove helper
        run: |
          uv run ruff format \
            packages/maistro-core/src/maistro/runs/lifecycle.py \
            packages/maistro-core/src/maistro/runs/model.py \
            packages/maistro-core/src/maistro/runs/sqlite_store.py \
            packages/maistro-core/tests/runs/test_attempt_result_reconciliation.py
          git rm .github/workflows/format-422.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/src/maistro/runs/lifecycle.py \
                  packages/maistro-core/src/maistro/runs/model.py \
                  packages/maistro-core/src/maistro/runs/sqlite_store.py \
                  packages/maistro-core/tests/runs/test_attempt_result_reconciliation.py
          git commit -m "style: apply pinned Ruff formatting"
          git push origin HEAD:feat/attempt-result-acceptance
