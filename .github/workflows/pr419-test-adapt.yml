name: pr419-test-adapt

on:
  push:
    branches: [feat/graph-frontier-execution]

permissions:
  contents: write

jobs:
  adapt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-frontier-execution
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - name: Adapt legacy executor-gap tests to frontier helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/maistro-core/tests/graph/durable_runs/test_executor_gaps.py')
          text = path.read_text()
          text = text.replace('    _ensure_running_node_run,\n', '    _ensure_frontier_node_runs,\n')
          text = text.replace('    _lift_blackboard,\n', '')
          old = '''class TestContextAndBlackboard:\n    def test_none_blackboard_returns_record_unchanged(self) -> None:\n        record = _record_for("r-lift")\n        ctx = NodeContext(run_id="r-lift", dag_id="d1", node_id="n1", blackboard=None)\n        assert _lift_blackboard(record, ctx) is record\n\n    def test_malformed_blackboard_snapshot_falls_back_to_none(self) -> None:\n'''
          new = '''class TestContextAndBlackboard:\n    def test_malformed_blackboard_snapshot_falls_back_to_none(self) -> None:\n'''
          if old not in text:
              raise SystemExit('expected obsolete blackboard test block not found')
          text = text.replace(old, new)
          old_call = 'updated, node_run = await _ensure_running_node_run(record, "n1", store=store)'
          new_call = 'updated, node_runs = await _ensure_frontier_node_runs(record, ("n1",), store=store)\n        node_run = node_runs[0]'
          if text.count(old_call) != 2:
              raise SystemExit(f'expected 2 legacy helper calls, found {text.count(old_call)}')
          text = text.replace(old_call, new_call)
          path.write_text(text)
          PY
      - name: Focused verification
        run: |
          uv python install 3.12
          uv sync --locked --all-extras
          uv run ruff format packages/maistro-core/tests/graph/durable_runs/test_executor_gaps.py
          uv run ruff check packages/maistro-core/tests/graph/durable_runs/test_executor_gaps.py
          uv run pytest packages/maistro-core/tests/graph/durable_runs/test_executor_gaps.py -q
      - name: Commit test adaptation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/maistro-core/tests/graph/durable_runs/test_executor_gaps.py
          git diff --cached --quiet && exit 0
          git commit -m "Update durable executor gap tests for frontiers"
          git push origin HEAD:feat/graph-frontier-execution
