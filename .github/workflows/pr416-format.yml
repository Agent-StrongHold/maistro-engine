name: PR416 exact Ruff format

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-durable-canonical-persistence
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - name: Format PR416 Python files
        run: |
          uv run ruff format \
            packages/maistro-core/src/maistro/graph/durable_runs \
            packages/maistro-core/tests/graph/_canonical_helpers.py \
            packages/maistro-core/tests/graph/durable_runs \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py \
            packages/maistro-core/tests/graph/test_stream5_parity_characterization.py \
            packages/maistro-core/tests/graph/seeds/test_seeds.py \
            packages/maistro-core/tests/graph/nodes/test_rsi_quota_pace_trigger.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/src/maistro/graph/durable_runs packages/maistro-core/tests/graph
          git commit -m "style(graph): format canonical durable migration"
          git push origin HEAD:feat/graph-durable-canonical-persistence
