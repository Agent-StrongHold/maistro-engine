name: PR416 exact Ruff format

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-durable-canonical-persistence
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - name: Format durable graph production files
        run: |
          uv run ruff format packages/maistro-core/src/maistro/graph/durable_runs/executor.py packages/maistro-core/src/maistro/graph/durable_runs/stores.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/src/maistro/graph/durable_runs/executor.py packages/maistro-core/src/maistro/graph/durable_runs/stores.py
          git commit -m "style(graph): apply exact Ruff formatting"
          git push origin HEAD:feat/graph-durable-canonical-persistence
