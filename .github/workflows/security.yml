# Security gate — SAST + supply chain + container scanning.
#
# Pillar 5 of the QA gate. The heavy bag (container build + scan) runs only on
# PR-to-main + main pushes + nightly. Lightweight SAST runs on every push.
#
# No DAST here. There was a `dast:` job that skipped every step when
# docker-compose.vibehost-maistro.yml was absent — and that file has never been in
# this repo, so the job reported green while scanning nothing. The deployment
# stack it needs lives in the deployment repo; if DAST is wanted it belongs there,
# next to the compose file that defines the target.

name: security

on:
  pull_request:
    branches: [main, integration, develop]
  push:
    branches: [main, integration, develop, feat/*]
  schedule:
    # Nightly full SBOM + image scan.
    - cron: "30 7 * * *"

jobs:
  # ----- SAST: bandit + semgrep + gitleaks (fast; every push) -----
  sast:
    name: SAST (bandit + semgrep + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v7
      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --all-extras

      # bandit is NOT a project extra (see requirements-dev-tools.txt) — install
      # it into the synced venv; semgrep carries conflicting pins, so it runs
      # isolated via uvx below.
      - name: install SAST tools
        run: uv pip install bandit

      - name: bandit (zero Medium+ on OUR code)
        run: |
          uv run bandit -r packages/maistro-core/src packages/hive-conductor/backend \
                          packages/maistro-server/src \
                          -ll --confidence-level=medium -f json -o bandit.json || true
          # IRON gate: ZERO Medium+ findings on CI-scope source. Tasks #18-#20
          # (B310/B104/B108) all triaged 2026-05-22 to zero; the previous
          # baseline of 12 is now stale. Any new Medium+ MUST be addressed
          # in the same PR — either as a code fix or with an inline
          # # nosec <code> comment + a defended false-positive rationale.
          uv run python -c "
          import json, sys
          data = json.load(open('bandit.json'))
          new = [r for r in data.get('results', []) if r.get('issue_severity') in {'MEDIUM','HIGH'}]
          if new:
              print(f'::error::bandit found {len(new)} Medium+ finding(s) — strict 0-baseline:')
              for r in new:
                  print(f'  {r[\"filename\"]}:{r[\"line_number\"]} [{r[\"test_id\"]}] {r[\"issue_text\"]}')
              sys.exit(1)
          print('bandit Medium+ count: 0 (strict gate)')
          "

      - name: semgrep (custom + p/security-audit + p/owasp-top-ten + p/secrets)
        run: |
          set -o pipefail
          # cage/ and eval/ are IMMUTABLE (cage-guard.yml auto-rejects any PR that
          # touches them), so they cannot carry inline # nosemgrep suppressions. The
          # eval harness's whole function is to exec/eval model-generated code, so
          # exclude these immutable paths from the scan rather than flag the unfixable.
          uvx semgrep --metrics off \
            --config tools/semgrep/maistro-rules.yaml \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --exclude 'packages/hive-conductor/eval' \
            --exclude 'packages/hive-conductor/cage' \
            --error packages/ apps/ tests/ 2>&1 | tee semgrep-report.txt

      - name: gitleaks (full-history scan on main; commit-range on PR)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----- Supply chain: pip-audit (fast; every push) -----
  supply-chain:
    name: Supply chain (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v7
      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: uv sync
        run: uv sync --all-extras

      # pip-audit is NOT a project extra (see requirements-dev-tools.txt).
      - name: install supply-chain tools
        run: uv pip install pip-audit

      - name: pip-audit (strict; gate the known CVE list)
        run: |
          # Workspace-local editable packages aren't on PyPI — pip-audit --strict
          # refuses them, so audit the frozen third-party set (same as ci.yml).
          uv pip freeze --exclude-editable > /tmp/deps.txt
          # `|| true`: pip-audit exits non-zero on any finding; the gate script
          # decides what blocks. The triaged allowlist lives in that script so
          # this job and ci.yml's `security` job cannot drift apart.
          uv run pip-audit --strict --format=json -r /tmp/deps.txt > pip-audit.json || true
          uv run python scripts/pip_audit_gate.py pip-audit.json

      # The `safety check` cross-check that used to sit here was removed, not
      # escalated. Measured 2026-07-26, it was not a weak gate but a broken one:
      #   * `check` has been deprecated since 2024-06-01, and prints its
      #     deprecation banner into the `--json` stream — the output is not valid
      #     JSON, so nothing could ever have consumed it.
      #   * It ran unauthenticated (api_key=false), so it saw a subset of the DB.
      #   * Its only two findings were ecdsa 0.19.2 with no fix available, both
      #     already reported by the pip-audit gate directly above.
      #   * It pulled nltk, whose own advisory then had to be added to the
      #     allowlist above. The scanner was adding vulnerabilities to the scan.
      # pip-audit --strict is the supply-chain gate. One gate that blocks beats two
      # where one only warns.

  # ----- Container scan + SBOM + signing (PR-to-main + nightly only) -----
  # Heavy bag stays scoped to main: PRs targeting develop/integration only run
  # the fast SAST + supply-chain jobs above (Phase 19 progressive ladder).
  containers:
    name: Container scan + SBOM + cosign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Build hive-conductor image
        run: |
          docker build -f packages/hive-conductor/Dockerfile \
            --build-arg VITE_POC_MODE=pm \
            --build-arg VITE_BASE_PATH=/pm/ \
            -t hive-conductor:pr-${{ github.event.pull_request.number || 'nightly' }} .

      - name: Build maistro-engine image
        run: docker build -t maistro-engine:pr-${{ github.event.pull_request.number || 'nightly' }} .

      - name: Trivy scan (HIGH/CRITICAL only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hive-conductor:pr-${{ github.event.pull_request.number || 'nightly' }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Grype scan (cross-check)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype hive-conductor:pr-${{ github.event.pull_request.number || 'nightly' }} \
            --fail-on high --only-fixed --output table

      - name: SBOM (syft CycloneDX-JSON)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft hive-conductor:pr-${{ github.event.pull_request.number || 'nightly' }} \
            -o cyclonedx-json > sbom-hive-conductor.json
          syft maistro-engine:pr-${{ github.event.pull_request.number || 'nightly' }} \
            -o cyclonedx-json > sbom-maistro-engine.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms-${{ github.event.pull_request.number || 'nightly' }}
          path: sbom-*.json

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v7
      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: License compliance (no GPL/AGPL on new deps)
        run: |
          uv run pip install pip-licenses
          uv run pip-licenses --fail-on='GPL;LGPL;AGPL' --format=markdown \
            --output-file=licenses.md

      # cosign sign: only on main pushes (we have the OIDC identity then)
      - name: cosign install
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@main

      - name: cosign keyless sign
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes hive-conductor:pr-${{ github.event.pull_request.number || 'nightly' }}
          cosign sign --yes maistro-engine:pr-${{ github.event.pull_request.number || 'nightly' }}
