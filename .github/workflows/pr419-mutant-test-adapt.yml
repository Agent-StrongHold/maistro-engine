name: pr419-mutant-test-adapt

on:
  push:
    branches: [feat/graph-frontier-execution]

permissions:
  contents: write

jobs:
  adapt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-frontier-execution
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - name: Adapt mutation-sensitive tests to frontier execution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py')
          text = path.read_text()
          text = text.replace('    _checkpoint_success,\n', '')
          text = text.replace('    _ensure_running_node_run,\n', '    _ensure_frontier_node_runs,\n')
          text = text.replace('    _lift_blackboard,\n', '')

          old_call = 'updated, node_run = await _ensure_running_node_run(record, "n1", store=store)'
          new_call = 'updated, node_runs = await _ensure_frontier_node_runs(record, ("n1",), store=store)\n        node_run = node_runs[0]'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one node_run helper call, got {text.count(old_call)}')
          text = text.replace(old_call, new_call)

          old_call = 'updated, resumed = await _ensure_running_node_run(record, "n1", store=store)'
          new_call = 'updated, node_runs = await _ensure_frontier_node_runs(record, ("n1",), store=store)\n        resumed = node_runs[0]'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one resumed helper call, got {text.count(old_call)}')
          text = text.replace(old_call, new_call)

          old_call = 'updated, repeated = await _ensure_running_node_run(record, "n1", store=store)'
          new_call = 'updated, node_runs = await _ensure_frontier_node_runs(record, ("n1",), store=store)\n        repeated = node_runs[0]'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one repeated helper call, got {text.count(old_call)}')
          text = text.replace(old_call, new_call)

          start = text.index('class TestCheckpointSuccess:\n')
          keep = text.index('    def test_result_output_preserves_mapping', start)
          text = text[:start] + 'class TestResultOutput:\n' + text[keep:] 

          start = text.index('class _Blackboard:\n')
          end = text.index('class TestInitialInputsAndIdentity:\n', start)
          text = text[:start] + text[end:]

          path.write_text(text)
          PY
      - name: Focused verification
        run: |
          uv python install 3.12
          uv sync --locked --all-extras
          uv run ruff format packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py
          uv run ruff check packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py
          uv run pytest packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py packages/maistro-core/tests/graph/durable_runs/test_frontier_execution.py packages/maistro-core/tests/graph/durable_runs/test_frontier_hitl.py -q
      - name: Commit adaptation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py
          git diff --cached --quiet && exit 0
          git commit -m "Update mutation tests for frontier execution"
          git push origin HEAD:feat/graph-frontier-execution
