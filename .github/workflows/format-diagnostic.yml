name: format-diagnostic
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev
      - name: Ruff formatter diff
        run: uv run ruff format --diff scripts/check_mutation_baseline.py scripts/mutation_packet.py scripts/mutation_ratchet.py tests/test_mutation_ratchet.py
