name: Refactor PR 419 complexity once

on:
  push:
    branches:
      - feat/graph-frontier-execution

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-frontier-execution
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.5.x
      - name: Split fan-in readiness predicates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/maistro-core/src/maistro/graph/durable_runs/executor.py")
          source = path.read_text()
          old = '''def _partition_ready_targets(
              record: DurableRunRecord,
              graph: Graph,
              next_ids: tuple[str, ...],
              decisions: tuple[GraphEdgeDecision, ...],
              paused: tuple[_FrontierItem, ...],
          ) -> tuple[tuple[str, ...], tuple[str, ...]]:
              candidates = _dedupe((*_deferred_frontier(record), *_deferred_fanins(record), *next_ids))
              roots = _dedupe((*_deferred_frontier(record), *next_ids, *(item.node_id for item in paused)))
              ready: list[str] = []
              blocked: list[str] = []

              for target in candidates:
                  incoming = _dedupe(edge.from_node for edge in graph.edges if edge.to_node == target)
                  if len(incoming) <= 1:
                      ready.append(target)
                      continue

                  resolved = {
                      decision.source_node_id
                      for decision in _selected_predecessor_decisions(
                          record,
                          target,
                          decisions=decisions,
                      )
                  }
                  unresolved = tuple(node_id for node_id in incoming if node_id not in resolved)
                  other_roots = tuple(node_id for node_id in roots if node_id != target)
                  waits_for_live_branch = any(
                      any(_can_reach(graph, root, predecessor) for root in other_roots)
                      for predecessor in unresolved
                  )
                  if waits_for_live_branch:
                      blocked.append(target)
                  else:
                      ready.append(target)

              return _dedupe(ready), _dedupe(blocked)
          '''
          new = '''def _selected_predecessor_sources(
              record: DurableRunRecord,
              target_node_id: str,
              decisions: tuple[GraphEdgeDecision, ...],
          ) -> set[str]:
              return {
                  decision.source_node_id
                  for decision in _selected_predecessor_decisions(
                      record,
                      target_node_id,
                      decisions=decisions,
                  )
              }


          def _fanin_waits_for_live_branch(
              record: DurableRunRecord,
              graph: Graph,
              target: str,
              decisions: tuple[GraphEdgeDecision, ...],
              roots: tuple[str, ...],
          ) -> bool:
              incoming = _dedupe(edge.from_node for edge in graph.edges if edge.to_node == target)
              if len(incoming) <= 1:
                  return False
              resolved = _selected_predecessor_sources(record, target, decisions)
              unresolved = tuple(node_id for node_id in incoming if node_id not in resolved)
              other_roots = tuple(node_id for node_id in roots if node_id != target)
              return any(
                  any(_can_reach(graph, root, predecessor) for root in other_roots)
                  for predecessor in unresolved
              )


          def _partition_ready_targets(
              record: DurableRunRecord,
              graph: Graph,
              next_ids: tuple[str, ...],
              decisions: tuple[GraphEdgeDecision, ...],
              paused: tuple[_FrontierItem, ...],
          ) -> tuple[tuple[str, ...], tuple[str, ...]]:
              candidates = _dedupe((*_deferred_frontier(record), *_deferred_fanins(record), *next_ids))
              roots = _dedupe((*_deferred_frontier(record), *next_ids, *(item.node_id for item in paused)))
              ready: list[str] = []
              blocked: list[str] = []
              for target in candidates:
                  target_list = (
                      blocked
                      if _fanin_waits_for_live_branch(record, graph, target, decisions, roots)
                      else ready
                  )
                  target_list.append(target)
              return _dedupe(ready), _dedupe(blocked)
          '''
          if old not in source:
              raise SystemExit("expected partition block not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Format and verify complexity
        run: |
          uvx ruff==0.15.12 format packages/maistro-core/src/maistro/graph/durable_runs/executor.py
          uvx radon==6.0.1 cc -s packages/maistro-core/src/maistro/graph/durable_runs/executor.py
          if uvx radon==6.0.1 cc -nc packages/maistro-core/src/maistro/graph/durable_runs/executor.py | grep -q '_partition_ready_targets'; then
            echo "_partition_ready_targets is still rank C or worse"
            exit 1
          fi
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/src/maistro/graph/durable_runs/executor.py
          git commit -m "Refactor durable fan-in readiness complexity"
          git push origin HEAD:feat/graph-frontier-execution
