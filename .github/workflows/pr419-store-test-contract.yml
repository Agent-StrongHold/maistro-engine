name: pr419-store-test-contract

on:
  push:
    branches: [feat/graph-frontier-execution]

permissions:
  contents: write

jobs:
  adapt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-frontier-execution
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - name: Align store fixtures with canonical paused NodeRuns
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/maistro-core/tests/graph/durable_runs/test_stores_gaps.py')
          text = path.read_text()
          text = text.replace(
              'from maistro.runs.model import RunStatus\n',
              'from maistro.runs.lifecycle import transition_node_run\nfrom maistro.runs.model import NodeRun, RunStatus\n',
          )
          old = '''    nodes = [{"id": active_node_id, "kind": "test.noop"}] if active_node_id else [{"id": "n1"}]\n    return durable_record(\n        {"id": "d1", "nodes": nodes, "edges": []},\n        run_id=run_id,\n        status=status,\n        active_node_id=active_node_id,\n        project_id=str(project_id),\n    )\n'''
          new = '''    nodes = [{"id": active_node_id, "kind": "test.noop"}] if active_node_id else [{"id": "n1"}]\n    node_runs = ()\n    if status is RunStatus.PAUSED and active_node_id:\n        node_run = NodeRun(run_id=run_id, node_id=str(active_node_id), ordinal=1)\n        node_run = transition_node_run(node_run, RunStatus.QUEUED)\n        node_run = transition_node_run(node_run, RunStatus.RUNNING)\n        node_run = transition_node_run(node_run, RunStatus.PAUSED)\n        node_runs = (node_run,)\n    return durable_record(\n        {"id": "d1", "nodes": nodes, "edges": []},\n        run_id=run_id,\n        status=status,\n        active_node_id=active_node_id,\n        project_id=str(project_id),\n        node_runs=node_runs,\n    )\n'''
          if old not in text:
              raise SystemExit('expected store fixture block not found')
          text = text.replace(old, new)
          old_assert = 'with pytest.raises(ValueError, match="waiting on node"):'
          if text.count(old_assert) != 2:
              raise SystemExit(f'expected two legacy frontier assertions, got {text.count(old_assert)}')
          text = text.replace(old_assert, 'with pytest.raises(ValueError, match="waiting on frontier"):')
          path.write_text(text)
          PY
      - name: Verify durable runs scope
        run: |
          uv python install 3.12
          uv sync --locked --all-extras
          uv run ruff format packages/maistro-core/tests/graph/durable_runs/test_stores_gaps.py
          uv run ruff check packages/maistro-core/tests/graph/durable_runs/test_stores_gaps.py
          uv run pytest packages/maistro-core/tests/graph/durable_runs --timeout=15 -q -x
      - name: Commit contract update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/maistro-core/tests/graph/durable_runs/test_stores_gaps.py
          git diff --cached --quiet && exit 0
          git commit -m "Align HITL store tests with frontier semantics"
          git push origin HEAD:feat/graph-frontier-execution
