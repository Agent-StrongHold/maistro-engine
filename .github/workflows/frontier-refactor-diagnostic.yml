name: frontier refactor diagnostic

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-frontier-execution
      - uses: astral-sh/setup-uv@v7
      - name: Split HITL answer helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/maistro-core/src/maistro/graph/durable_runs/stores.py')
          text = path.read_text()
          text = text.replace(
              'import sqlite3\nfrom datetime import UTC, datetime',
              'import sqlite3\nfrom collections.abc import Mapping\nfrom datetime import UTC, datetime',
          )
          start = text.index('def _answer_record(')
          end = text.index('\n\nclass InMemoryDurableRunStore:', start)
          replacement = '''def _paused_node_run_index(record: DurableRunRecord, node_id: str) -> int:
              for index in range(len(record.node_runs) - 1, -1, -1):
                  node_run = record.node_runs[index]
                  if node_run.node_id == node_id and node_run.status is RunStatus.PAUSED:
                      return index
              raise ValueError(
                  f"run {record.run_id!r} has no paused NodeRun for node {node_id!r}"
              )


          def _pause_metadata_after_answer(
              record: DurableRunRecord,
              metadata: dict[str, Any],
              node_id: str,
          ) -> dict[str, Any]:
              pauses_raw = metadata.get("pauses", {})
              pauses = dict(pauses_raw) if isinstance(pauses_raw, Mapping) else {}
              pauses.pop(node_id, None)
              if not pauses:
                  metadata.pop("pauses", None)
                  metadata.pop("pause", None)
                  return metadata

              metadata["pauses"] = pauses
              first_node_id = next(
                  active_id
                  for active_id in record.graph_state.active_node_ids
                  if active_id in pauses
              )
              metadata["pause"] = pauses[first_node_id]
              return metadata


          def _answer_record(
              record: DurableRunRecord,
              node_id: str,
              answer: dict[str, Any],
          ) -> DurableRunRecord:
              if record.run.status is not RunStatus.PAUSED:
                  raise ValueError(
                      f"run {record.run_id!r} not paused on HITL (status={record.run.status})"
                  )
              if node_id not in record.graph_state.active_node_ids:
                  raise ValueError(
                      f"run {record.run_id!r} waiting on frontier "
                      f"{record.graph_state.active_node_ids!r}, not {node_id!r}"
                  )

              paused_index = _paused_node_run_index(record, node_id)
              answered = {**answer, "answered_at": datetime.now(UTC).isoformat()}
              metadata = dict(record.graph_state.metadata)
              answers = dict(record.hitl_answers)
              answers[node_id] = answered
              metadata["hitl_answers"] = answers
              metadata = _pause_metadata_after_answer(record, metadata, node_id)

              node_runs = list(record.node_runs)
              node_runs[paused_index] = transition_node_run(
                  node_runs[paused_index],
                  RunStatus.QUEUED,
              )
              remaining_paused = any(
                  node_run.status is RunStatus.PAUSED for node_run in node_runs
              )
              run = record.run if remaining_paused else transition_run(record.run, RunStatus.QUEUED)
              graph_state = _replace_state(record.graph_state, metadata=metadata)
              return _replace_record(
                  record,
                  run=run,
                  graph_state=graph_state,
                  node_runs=tuple(node_runs),
                  resume_at=record.resume_at if remaining_paused else None,
                  version=record.version + 1,
              )
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Format touched store
        run: uvx --from ruff==0.15.12 ruff format packages/maistro-core/src/maistro/graph/durable_runs/stores.py
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/maistro-core/src/maistro/graph/durable_runs/stores.py
          git commit -m 'refactor(graph): simplify frontier HITL persistence'
          git push origin HEAD:feat/graph-frontier-execution
