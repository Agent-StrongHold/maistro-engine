name: frontier reachability diagnostic

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-frontier-execution
      - name: Capture reachability result
        run: |
          python scripts/check-reachability.py > frontier-reachability.txt 2>&1 || true
          cat frontier-reachability.txt
      - name: Commit diagnostic output
        run: |
          if [ ! -f frontier-reachability.txt ]; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontier-reachability.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(ci): capture frontier reachability output'
          git push origin HEAD:feat/graph-frontier-execution
