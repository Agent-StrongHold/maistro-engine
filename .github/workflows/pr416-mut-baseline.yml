name: PR416 mutation baseline diagnostic

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - name: Reproduce graph-node mutation baseline
        continue-on-error: true
        run: |
          set -o pipefail
          env PYTHONPATH="$(find packages -type d -name src -printf '%p:')" \
            uv run pytest packages/maistro-core/tests/graph/nodes --timeout=15 -q -x \
            2>&1 | tee graph-nodes-baseline.txt
      - name: Upload baseline diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr416-mutation-baseline
          path: graph-nodes-baseline.txt
