name: PR416 mutation baseline diagnostic

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - run: uv pip install -r packages/hive-conductor/backend/requirements.txt
      - name: Reproduce sampled shard 0 baseline in exact order
        continue-on-error: true
        run: |
          set -o pipefail
          uv run python scripts/mutation_targets.py --all > mutation-targets-all.tsv
          awk '((NR - 1) % 32) == 0' mutation-targets-all.tsv > mutation-targets.tsv
          : > mutation-baseline.txt
          while IFS=$'\t' read -r src tests; do
            echo "=== $src :: $tests ===" | tee -a mutation-baseline.txt
            env PYTHONPATH="$(find packages -type d -name src -printf '%p:')" \
              uv run pytest "$tests" --timeout=20 -q -x \
              2>&1 | tee -a mutation-baseline.txt
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "FAILED_SCOPE=$tests" | tee -a mutation-baseline.txt
              exit "$rc"
            fi
          done < mutation-targets.tsv
      - name: Upload baseline diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr416-mutation-baseline
          path: |
            mutation-targets.tsv
            mutation-baseline.txt
