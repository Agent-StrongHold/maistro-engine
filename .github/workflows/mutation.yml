# Mutation testing (Cosmic Ray) — PR safety and repository health are separate.
#
# PR safety:
#   - mutate every changed production source file (plus sources mapped from
#     changed tests)
#   - require viability-adjusted kill rate >= 90%
#   - never depend on an unrelated repository sample
#
# Repository health:
#   - scheduled / manually dispatched only
#   - plan the complete production inventory into cost-aware packets
#   - checkpoint each completed source immediately for continuation-aware reruns
#   - aggregate all source checkpoints into one repository health report
#   - publish reviewed history/baseline candidates; never auto-accept regression

name: mutation

on:
  pull_request:
    branches: [main, integration, develop]
    paths:
      - 'packages/**/*.py'
      - 'scripts/mutation_*.py'
      - 'quality/mutation-*.json'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      target_packet_minutes:
        description: "Target estimated mutation work per packet"
        required: false
        default: "25"
        type: string
      runner_capacity:
        description: "Expected concurrent GitHub runner capacity"
        required: false
        default: "8"
        type: string

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-pr:
    name: Mutation testing on changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - name: Install Hive Conductor backend test dependencies
        run: uv pip install -r packages/hive-conductor/backend/requirements.txt

      - name: Identify every changed Python file
        id: changed
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=0 origin "$BASE_REF" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_REF"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- packages \
            | grep '\.py$' | grep -v '__pycache__' || true)
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No package Python changes require mutation testing."
          fi

      - name: Resolve changed files to source/test scopes
        if: steps.changed.outputs.skip != 'true'
        run: |
          uv run python scripts/mutation_targets.py "${{ steps.changed.outputs.files }}" > mutation-targets.tsv
          test -s mutation-targets.tsv
          cat mutation-targets.tsv

      - name: Prove each unmutated test command passes
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            echo "::group::baseline $src -> $tests"
            env PYTHONPATH="$(find packages -type d -name src -printf '%p:')" \
              uv run pytest "$tests" --timeout=15 -q -x
            echo "::endgroup::"
          done < mutation-targets.tsv

      - name: Mutate every changed source
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          : > mutation-rows.jsonl
          : > mutation-sessions.tsv
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            echo "::group::mutate $src (tests: $tests)"
            cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "$src"
          timeout = 30.0
          excluded-modules = []
          test-command = "env PYTHONPATH=$(find packages -type d -name src -printf '%p:') python -m pytest $tests --timeout=15 -q -x"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 4
          EOF
            session="session-$(echo "$src" | tr '/.' '__').sqlite"
            rm -f "$session"
            uv run cosmic-ray init cosmic-ray.toml "$session"
            uv run cosmic-ray exec cosmic-ray.toml "$session"
            uv run cosmic-ray dump "$session" >> mutation-rows.jsonl
            printf '%s\t%s\n' "$session" "$src" >> mutation-sessions.tsv
            echo "::endgroup::"
          done < mutation-targets.tsv

      - name: Changed-file mutation quality gate
        if: steps.changed.outputs.skip != 'true'
        run: |
          uv run python scripts/mutation_viability.py \
            --sessions mutation-sessions.tsv \
            --threshold 0.90 \
            --json mutation-gate.json

      - name: Upload PR mutation evidence
        if: always() && steps.changed.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-pr-${{ github.event.pull_request.number }}
          path: |
            session-*.sqlite
            mutation-rows.jsonl
            mutation-targets.tsv
            mutation-sessions.tsv
            mutation-gate.json

  mutation-health-plan:
    name: Plan repository mutation health sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      packets: ${{ steps.matrix.outputs.packets }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12

      - name: Resolve complete production inventory
        run: uv run python scripts/mutation_targets.py --all > mutation-targets-all.tsv

      - name: Build deterministic cost-aware plan
        env:
          TARGET_MINUTES: ${{ inputs.target_packet_minutes || '25' }}
          RUNNER_CAPACITY: ${{ inputs.runner_capacity || '8' }}
        run: |
          uv run python scripts/mutation_scheduler.py mutation-targets-all.tsv \
            --history quality/mutation-history.json \
            --target-minutes "$TARGET_MINUTES" \
            --runner-capacity "$RUNNER_CAPACITY" \
            --output mutation-plan.json
          cat mutation-plan.json

      - name: Export packet matrix
        id: matrix
        run: |
          packets=$(python -c "import json; print(json.dumps(json.load(open('mutation-plan.json'))['packets'], separators=(',', ':')))" )
          echo "packets=$packets" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mutation-health-plan-${{ github.run_id }}
          path: |
            mutation-targets-all.tsv
            mutation-plan.json

  mutation-health:
    name: Mutation health packet ${{ matrix.packet.id }}
    needs: mutation-health-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        packet: ${{ fromJSON(needs.mutation-health-plan.outputs.packets) }}
    env:
      PACKET_JSON: ${{ toJSON(matrix.packet) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - name: Install Hive Conductor backend test dependencies
        run: uv pip install -r packages/hive-conductor/backend/requirements.txt

      - name: Materialize packet targets
        run: |
          python - <<'PY'
          import json, os
          packet = json.loads(os.environ['PACKET_JSON'])
          with open('mutation-targets.tsv', 'w', encoding='utf-8') as fh:
              for target in packet['targets']:
                  fh.write(f"{target['source']}\t{target['tests']}\n")
          print(f"packet {packet['id']}: estimated {packet['estimated_seconds'] / 60:.1f} minutes")
          PY
          cat mutation-targets.tsv

      - name: Capture environment fingerprint
        run: |
          python - <<'PY' > mutation-environment.json
          import hashlib, json, platform, subprocess
          def out(*cmd):
              return subprocess.check_output(cmd, text=True).strip()
          payload = {
              'runner': 'ubuntu-latest',
              'python_version': platform.python_version(),
              'cosmic_ray_version': out('uv', 'run', 'cosmic-ray', '--version'),
              'pytest_version': out('uv', 'run', 'pytest', '--version'),
          }
          payload['tool_fingerprint'] = hashlib.sha256(
              json.dumps(payload, sort_keys=True).encode()
          ).hexdigest()
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          cat mutation-environment.json

      - name: Detect checkpoints from earlier attempts in this sweep
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: mutation-checkpoint-${{ github.run_id }}-
        run: |
          set -euo pipefail
          count=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            | python -c 'import json, os, sys; pages=json.load(sys.stdin); artifacts=sum((p.get("artifacts", []) for p in pages), []); print(sum(a.get("name", "").startswith(os.environ["PREFIX"]) for a in artifacts))')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p prior-checkpoints

      - name: Download checkpoints from earlier attempts
        if: steps.prior.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-checkpoint-${{ github.run_id }}-*
          path: prior-checkpoints
          merge-multiple: true

      - name: Install in-job artifact checkpoint client
        run: npm install --no-save --prefix /tmp/mutation-artifact-client @actions/artifact@2

      - name: Resume packet and checkpoint every completed source
        env:
          NODE_PATH: /tmp/mutation-artifact-client/node_modules
        run: |
          uv run python scripts/mutation_packet.py mutation-targets.tsv \
            --checkpoints prior-checkpoints \
            --environment mutation-environment.json \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --uploader scripts/upload_mutation_checkpoint.cjs

      - name: Score newly executed packet work
        id: score
        continue-on-error: true
        run: |
          if [ -s mutation-sessions.tsv ]; then
            uv run python scripts/mutation_viability.py \
              --sessions mutation-sessions.tsv \
              --threshold 0.90 \
              --json mutation-health.json
          else
            echo '{"continued": true, "new_sources": 0}' > mutation-health.json
          fi

      - name: Publish packet health summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          new = [json.loads(line) for line in open('mutation-telemetry.jsonl') if line.strip()] if __import__('pathlib').Path('mutation-telemetry.jsonl').exists() else []
          reused = [json.loads(line) for line in open('mutation-reused.jsonl') if line.strip()] if __import__('pathlib').Path('mutation-reused.jsonl').exists() else []
          print('## Mutation health packet')
          print()
          print(f"Continued from prior checkpoints: **{len(reused)} source(s)**")
          print(f"Executed this attempt: **{len(new)} source(s)**")
          print()
          print('| Source | Viable | Killed | Survived | Kill rate | Baseline | Mutation |')
          print('|---|---:|---:|---:|---:|---:|---:|')
          for row in reused + new:
              print(
                  f"| `{row['source']}` | {row['viable_mutants']} | {row['killed_mutants']} | "
                  f"{row['surviving_mutants']} | {row['kill_rate']:.1%} | "
                  f"{row['baseline_test_seconds']:.1f}s | {row['mutation_seconds'] / 60:.1f}m |"
              )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-health-packet-${{ matrix.packet.id }}-attempt-${{ github.run_attempt }}
          path: |
            mutation-targets.tsv
            mutation-targets-pending.tsv
            mutation-reused.jsonl
            mutation-environment.json
            mutation-sessions.tsv
            mutation-rows.jsonl
            mutation-telemetry.jsonl
            mutation-health.json
            report-*.json
            session-*.sqlite

  mutation-health-aggregate:
    name: Aggregate repository mutation health
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [mutation-health-plan, mutation-health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras

      - name: Download sweep plan
        uses: actions/download-artifact@v4
        with:
          name: mutation-health-plan-${{ github.run_id }}
          path: mutation-plan-artifact

      - name: Detect completed source checkpoints
        id: checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: mutation-checkpoint-${{ github.run_id }}-
        run: |
          set -euo pipefail
          count=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            | python -c 'import json, os, sys; pages=json.load(sys.stdin); artifacts=sum((p.get("artifacts", []) for p in pages), []); print(sum(a.get("name", "").startswith(os.environ["PREFIX"]) for a in artifacts))')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p mutation-checkpoints-all

      - name: Download every completed source checkpoint
        if: steps.checkpoints.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-checkpoint-${{ github.run_id }}-*
          path: mutation-checkpoints-all
          merge-multiple: true

      - name: Build repository mutation health report
        run: |
          uv run python scripts/mutation_aggregate.py \
            --checkpoints mutation-checkpoints-all \
            --inventory mutation-plan-artifact/mutation-targets-all.tsv \
            --history quality/mutation-history.json \
            --telemetry-output mutation-telemetry-all.jsonl \
            --rows-output mutation-rows-all.jsonl \
            --json-output mutation-health-report.json \
            --markdown-output mutation-health-report.md
          cat mutation-health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build reviewed mutation history candidate
        run: |
          uv run python scripts/mutation_history.py mutation-telemetry-all.jsonl \
            --history quality/mutation-history.json \
            --output mutation-history-candidate.json

      - name: Build reviewed mutation baseline candidate
        run: |
          cp quality/mutation-baseline.json mutation-baseline-candidate.json
          if [ -s mutation-rows-all.jsonl ]; then
            uv run python scripts/check_mutation_baseline.py mutation-rows-all.jsonl \
              --baseline mutation-baseline-candidate.json \
              --write-baseline
          fi

      - name: Upload repository mutation health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-health-report-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            mutation-health-report.json
            mutation-health-report.md
            mutation-telemetry-all.jsonl
            mutation-rows-all.jsonl
            mutation-history-candidate.json
            mutation-baseline-candidate.json

      - name: Require a complete health sweep
        run: |
          python - <<'PY'
          import json
          report = json.load(open('mutation-health-report.json'))
          if not report['complete']:
              missing = len(report['unmeasured_sources'])
              raise SystemExit(f"mutation health sweep incomplete: {missing} source(s) remain; rerun failed jobs to continue")
          PY
