# Mutation testing (Cosmic Ray) — PR safety and repository health are separate.
#
# PR safety:
#   - mutate every changed production source file (plus sources mapped from
#     changed tests)
#   - require viability-adjusted kill rate >= 90%
#   - never depend on an unrelated repository sample
#
# Repository health:
#   - scheduled / manually dispatched only
#   - plan the complete production inventory into cost-aware packets
#   - collect per-source timing, quality, content and environment telemetry
#   - publish reviewed history/baseline candidates; never auto-accept regression

name: mutation

on:
  pull_request:
    branches: [main, integration, develop]
    paths:
      - 'packages/**/*.py'
      - 'scripts/mutation_*.py'
      - 'quality/mutation-*.json'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      target_packet_minutes:
        description: "Target estimated mutation work per packet"
        required: false
        default: "25"
        type: string
      runner_capacity:
        description: "Expected concurrent GitHub runner capacity"
        required: false
        default: "8"
        type: string

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-pr:
    name: Mutation testing on changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - name: Install Hive Conductor backend test dependencies
        run: uv pip install -r packages/hive-conductor/backend/requirements.txt

      - name: Identify every changed Python file
        id: changed
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=0 origin "$BASE_REF" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_REF"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- packages \
            | grep '\.py$' | grep -v '__pycache__' || true)
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No package Python changes require mutation testing."
          fi

      - name: Resolve changed files to source/test scopes
        if: steps.changed.outputs.skip != 'true'
        run: |
          uv run python scripts/mutation_targets.py "${{ steps.changed.outputs.files }}" > mutation-targets.tsv
          test -s mutation-targets.tsv
          cat mutation-targets.tsv

      - name: Prove each unmutated test command passes
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            echo "::group::baseline $src -> $tests"
            env PYTHONPATH="$(find packages -type d -name src -printf '%p:')" \
              uv run pytest "$tests" --timeout=15 -q -x
            echo "::endgroup::"
          done < mutation-targets.tsv

      - name: Mutate every changed source
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          : > mutation-rows.jsonl
          : > mutation-sessions.tsv
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            echo "::group::mutate $src (tests: $tests)"
            cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "$src"
          timeout = 30.0
          excluded-modules = []
          test-command = "env PYTHONPATH=$(find packages -type d -name src -printf '%p:') python -m pytest $tests --timeout=15 -q -x"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 4
          EOF
            session="session-$(echo "$src" | tr '/.' '__').sqlite"
            rm -f "$session"
            uv run cosmic-ray init cosmic-ray.toml "$session"
            uv run cosmic-ray exec cosmic-ray.toml "$session"
            uv run cosmic-ray dump "$session" >> mutation-rows.jsonl
            printf '%s\t%s\n' "$session" "$src" >> mutation-sessions.tsv
            echo "::endgroup::"
          done < mutation-targets.tsv

      - name: Changed-file mutation quality gate
        if: steps.changed.outputs.skip != 'true'
        run: |
          uv run python scripts/mutation_viability.py \
            --sessions mutation-sessions.tsv \
            --threshold 0.90 \
            --json mutation-gate.json

      - name: Upload PR mutation evidence
        if: always() && steps.changed.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-pr-${{ github.event.pull_request.number }}
          path: |
            session-*.sqlite
            mutation-rows.jsonl
            mutation-targets.tsv
            mutation-sessions.tsv
            mutation-gate.json

  mutation-health-plan:
    name: Plan repository mutation health sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      packets: ${{ steps.matrix.outputs.packets }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12

      - name: Resolve complete production inventory
        run: uv run python scripts/mutation_targets.py --all > mutation-targets-all.tsv

      - name: Build deterministic cost-aware plan
        env:
          TARGET_MINUTES: ${{ inputs.target_packet_minutes || '25' }}
          RUNNER_CAPACITY: ${{ inputs.runner_capacity || '8' }}
        run: |
          uv run python scripts/mutation_scheduler.py mutation-targets-all.tsv \
            --history quality/mutation-history.json \
            --target-minutes "$TARGET_MINUTES" \
            --runner-capacity "$RUNNER_CAPACITY" \
            --output mutation-plan.json
          cat mutation-plan.json

      - name: Export packet matrix
        id: matrix
        run: |
          packets=$(python -c "import json; print(json.dumps(json.load(open('mutation-plan.json'))['packets'], separators=(',', ':')))" )
          echo "packets=$packets" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mutation-health-plan-${{ github.run_id }}
          path: |
            mutation-targets-all.tsv
            mutation-plan.json

  mutation-health:
    name: Mutation health packet ${{ matrix.packet.id }}
    needs: mutation-health-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        packet: ${{ fromJSON(needs.mutation-health-plan.outputs.packets) }}
    env:
      PACKET_JSON: ${{ toJSON(matrix.packet) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - name: Install Hive Conductor backend test dependencies
        run: uv pip install -r packages/hive-conductor/backend/requirements.txt

      - name: Materialize packet targets
        run: |
          python - <<'PY'
          import json, os
          packet = json.loads(os.environ['PACKET_JSON'])
          with open('mutation-targets.tsv', 'w', encoding='utf-8') as fh:
              for target in packet['targets']:
                  fh.write(f"{target['source']}\t{target['tests']}\n")
          print(f"packet {packet['id']}: estimated {packet['estimated_seconds'] / 60:.1f} minutes")
          PY
          cat mutation-targets.tsv

      - name: Capture environment fingerprint
        run: |
          python - <<'PY' > mutation-environment.json
          import hashlib, json, platform, subprocess
          def out(*cmd):
              return subprocess.check_output(cmd, text=True).strip()
          payload = {
              'runner': 'ubuntu-latest',
              'python_version': platform.python_version(),
              'cosmic_ray_version': out('uv', 'run', 'cosmic-ray', '--version'),
              'pytest_version': out('uv', 'run', 'pytest', '--version'),
          }
          payload['tool_fingerprint'] = hashlib.sha256(
              json.dumps(payload, sort_keys=True).encode()
          ).hexdigest()
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          cat mutation-environment.json

      - name: Baseline and mutate packet sources with per-source telemetry
        run: |
          set -euo pipefail
          : > mutation-telemetry.jsonl
          : > mutation-sessions.tsv
          : > mutation-rows.jsonl
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            safe=$(echo "$src" | tr '/.' '__')
            session="session-${safe}.sqlite"
            report="report-${safe}.json"

            baseline_start=$(python -c 'import time; print(time.time())')
            env PYTHONPATH="$(find packages -type d -name src -printf '%p:')" \
              uv run pytest "$tests" --timeout=20 -q -x
            baseline_end=$(python -c 'import time; print(time.time())')

            cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "$src"
          timeout = 60.0
          excluded-modules = []
          test-command = "env PYTHONPATH=$(find packages -type d -name src -printf '%p:') python -m pytest $tests --timeout=20 -q -x"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 4
          EOF

            mutation_start=$(python -c 'import time; print(time.time())')
            uv run cosmic-ray init cosmic-ray.toml "$session"
            uv run cosmic-ray exec cosmic-ray.toml "$session"
            mutation_end=$(python -c 'import time; print(time.time())')
            uv run cosmic-ray dump "$session" >> mutation-rows.jsonl
            printf '%s\t%s\n' "$session" "$src" >> mutation-sessions.tsv
            uv run python scripts/mutation_viability.py "$session" "$src" --json "$report"

            SRC="$src" TESTS="$tests" REPORT="$report" \
            BASELINE_START="$baseline_start" BASELINE_END="$baseline_end" \
            MUTATION_START="$mutation_start" MUTATION_END="$mutation_end" \
            GIT_SHA="$GITHUB_SHA" python - <<'PY' >> mutation-telemetry.jsonl
          import hashlib, json, os
          from pathlib import Path

          def tree_hash(path_text):
              path = Path(path_text)
              digest = hashlib.sha256()
              files = [path] if path.is_file() else sorted(p for p in path.rglob('*') if p.is_file())
              for item in files:
                  digest.update(item.as_posix().encode())
                  digest.update(item.read_bytes())
              return digest.hexdigest()

          src = os.environ['SRC']
          tests = os.environ['TESTS']
          report = json.load(open(os.environ['REPORT']))
          env = json.load(open('mutation-environment.json'))
          adjusted = report['adjusted']
          row = {
              'source': src,
              'source_hash': tree_hash(src),
              'test_scope_hash': tree_hash(tests),
              'baseline_test_seconds': float(os.environ['BASELINE_END']) - float(os.environ['BASELINE_START']),
              'mutation_seconds': float(os.environ['MUTATION_END']) - float(os.environ['MUTATION_START']),
              'mutant_count': report['raw']['total'],
              'viable_mutants': adjusted['total'],
              'killed_mutants': adjusted['killed'],
              'surviving_mutants': len(report['viable']),
              'non_viable_mutants': len(report['non_viable']),
              'invalid_mutants': len(report['invalid']),
              'undetermined_mutants': len(report['undetermined']),
              'kill_rate': adjusted['rate'],
              'runner': env['runner'],
              'python_version': env['python_version'],
              'cosmic_ray_version': env['cosmic_ray_version'],
              'pytest_version': env['pytest_version'],
              'tool_fingerprint': env['tool_fingerprint'],
              'verified_commit': os.environ['GIT_SHA'],
              'verified_at': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'complete': report['pending'] == 0,
          }
          print(json.dumps(row, sort_keys=True))
          PY
          done < mutation-targets.tsv

      - name: Score packet without turning repository health into a PR gate
        id: score
        continue-on-error: true
        run: |
          uv run python scripts/mutation_viability.py \
            --sessions mutation-sessions.tsv \
            --threshold 0.90 \
            --json mutation-health.json

      - name: Build reviewed mutation history candidate
        run: |
          uv run python scripts/mutation_history.py mutation-telemetry.jsonl \
            --history quality/mutation-history.json \
            --output mutation-history-candidate-${{ matrix.packet.id }}.json

      - name: Build reviewed mutation baseline candidate
        run: |
          cp quality/mutation-baseline.json mutation-baseline-candidate-${{ matrix.packet.id }}.json
          uv run python scripts/check_mutation_baseline.py mutation-rows.jsonl \
            --baseline mutation-baseline-candidate-${{ matrix.packet.id }}.json \
            --write-baseline

      - name: Publish packet health summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          telemetry = [json.loads(line) for line in open('mutation-telemetry.jsonl') if line.strip()]
          print('## Mutation health packet')
          print()
          print('| Source | Viable | Killed | Survived | Kill rate | Baseline | Mutation |')
          print('|---|---:|---:|---:|---:|---:|---:|')
          for row in telemetry:
              print(
                  f"| `{row['source']}` | {row['viable_mutants']} | {row['killed_mutants']} | "
                  f"{row['surviving_mutants']} | {row['kill_rate']:.1%} | "
                  f"{row['baseline_test_seconds']:.1f}s | {row['mutation_seconds'] / 60:.1f}m |"
              )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-health-packet-${{ matrix.packet.id }}
          path: |
            mutation-targets.tsv
            mutation-environment.json
            mutation-sessions.tsv
            mutation-rows.jsonl
            mutation-telemetry.jsonl
            mutation-health.json
            mutation-history-candidate-${{ matrix.packet.id }}.json
            mutation-baseline-candidate-${{ matrix.packet.id }}.json
            report-*.json
            session-*.sqlite
