# Mutation testing (cosmic-ray) — Pillar 4 of the QA gate.
#
# Gate: ≥90% mutation kill rate on the files it mutates.
#
# Scope is tiered by what the PR is gating, because a full per-file sweep costs
# roughly six minutes per changed file and cannot fit a fast feedback loop:
#
#   - PR -> develop/integration : the MOST SECURITY-RELEVANT changed files
#     (security/, policy/, router/, then graph/), capped at MUTATION_FILE_CAP.
#     Fast feedback. Any file not mutated is named explicitly in the log —
#     never silently dropped.
#   - PR -> main (the release gate) : EVERY changed file, no cap. This is
#     where develop's accumulated work is held to full coverage, and the long
#     runtime is affordable because it happens once per release.
#   - Nightly : full sweep across the load-bearing substrate.
#
# Surviving mutants are tracked in docs/MUTATION-SURVIVORS.md and are
# treated as defects (test missed a real regression).

name: mutation

on:
  pull_request:
    branches: [main, integration, develop]
    paths:
      - 'packages/maistro-core/src/maistro/graph/**'
      - 'packages/maistro-core/src/maistro/projects/**'
      - 'packages/maistro-core/src/maistro/memory/**'
      # security/ and router/ must be here as well as in the changed-files
      # filter below: a PR touching ONLY security code never triggered this
      # workflow, so widening the inner filter alone changed nothing for
      # exactly the files where surviving mutants matter most.
      - 'packages/maistro-core/src/maistro/security/**'
      - 'packages/maistro-core/src/maistro/router/**'
      # policy/ ranks second in scripts/mutation_targets.py's priority table,
      # which was unreachable while this list omitted it: a policy-only PR
      # never started the job, and policy files in a mixed PR never reached
      # the ranking. A priority entry for a subtree the gate cannot see is a
      # claim about coverage that nothing delivers.
      - 'packages/maistro-core/src/maistro/policy/**'
  schedule:
    - cron: "0 6 * * *"   # nightly 06:00 UTC

jobs:
  mutation-pr:
    name: Mutation testing on changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ~6 min per changed file measured on PR #265 (5 of 13 files in 30 min).
    # The release gate gets a budget that can actually finish a full sweep;
    # feature PRs stay fast because their scope is capped below.
    timeout-minutes: ${{ github.base_ref == 'main' && 180 || 30 }}
    env:
      # 0 = no cap (full sweep). Only the develop -> main gate gets it.
      MUTATION_FILE_CAP: ${{ github.base_ref == 'main' && '0' || '4' }}
      # Via env, not inlined into the run script: a branch name interpolated
      # straight into shell is an injection seam, and this one is
      # attacker-influenced on fork PRs.
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-extras

      - name: Identify changed Python files under load-bearing subtrees
        id: changed
        run: |
          # Diff against the PR's OWN base, not a hardcoded origin/main. This
          # workflow also runs for PRs into develop/integration, where
          # `origin/main...HEAD` reports everything the base branch carries
          # beyond main as though this PR had changed it. Measured on this very
          # PR: 0 files under these subtrees vs origin/develop, 13 vs
          # origin/main. With a 4-file cap that meant the budget was spent
          # mutating inherited code the PR never touched, and the gate then
          # reported a pass that said nothing about the change under review —
          # the precise phantom-gate shape this workflow exists to remove.
          git fetch --no-tags --depth=0 origin "$BASE_REF" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_REF"
          # --diff-filter=ACMR excludes deletions: `resolve_tests` validates
          # that the TEST path exists, never the source, so a deleted module
          # whose test directory survives resolves happily, consumes a capped
          # slot, and hands cosmic-ray a module-path that is not there.
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- \
            'packages/maistro-core/src/maistro/graph/' \
            'packages/maistro-core/src/maistro/projects/' \
            'packages/maistro-core/src/maistro/memory/' \
            'packages/maistro-core/src/maistro/security/' \
            'packages/maistro-core/src/maistro/router/' \
            'packages/maistro-core/src/maistro/policy/' \
            | grep '\.py$' | grep -v '__pycache__' | grep -v '/tests/' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -z "$CHANGED" ]; then
            echo "No load-bearing files changed; skipping mutation test."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Resolve each changed file to its scoped tests
        id: targets
        if: steps.changed.outputs.skip != 'true'
        run: |
          # Default 4, NOT 0. If the `github.base_ref` expression ever yields
          # empty (an event type that doesn't set it), `:-0` would mean "no
          # cap" and put the job straight back into the 30-minute timeout it
          # was rewritten to escape. Degrade toward the bounded run: a capped
          # sweep that finishes and says what it skipped beats an uncapped one
          # that gets killed and reports nothing.
          echo "Base branch: '${{ github.base_ref }}' — file cap: ${MUTATION_FILE_CAP:-4} (0 = full sweep)"
          uv run python scripts/mutation_targets.py \
            --limit "${MUTATION_FILE_CAP:-4}" \
            "${{ steps.changed.outputs.files }}" \
            > mutation-targets.tsv
          echo "Resolved targets:"; cat mutation-targets.tsv
          if [ ! -s mutation-targets.tsv ]; then
            echo "::error::No changed file resolved to a scoped test path."
            exit 1
          fi

      # A broken test command makes EVERY mutant look killed — cosmic-ray reads
      # any nonzero exit as "the tests caught it", so a usage error is
      # indistinguishable from a real kill and the gate reports a vacuous 100%.
      # That was live: `--timeout=` needs pytest-timeout, which nothing in this
      # job installed. Prove the command passes on UNMUTATED code first.
      - name: Baseline — the test command must pass before any mutant is trusted
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            echo "::group::baseline $tests"
            env PYTHONPATH=packages/maistro-core/src uv run pytest "$tests" \
              --timeout=15 -q -x
            echo "::endgroup::"
          done < mutation-targets.tsv

      - name: cosmic-ray per changed file + aggregate gate
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -uo pipefail
          : > mutation-rows.jsonl
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            echo "::group::mutate $src (tests: $tests)"
            cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "$src"
          timeout = 30.0
          excluded-modules = []
          test-command = "env PYTHONPATH=packages/maistro-core/src python -m pytest $tests --timeout=15 -q -x"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 4
          EOF
            session="session-$(echo "$src" | tr '/.' '__').sqlite"
            rm -f "$session"
            uv run cosmic-ray init cosmic-ray.toml "$session"
            uv run cosmic-ray exec cosmic-ray.toml "$session"
            uv run cosmic-ray dump "$session" >> mutation-rows.jsonl
            echo "::endgroup::"
          done < mutation-targets.tsv

          uv run python -c "
          import json, sys
          # cosmic-ray dump prints one JSON array per line: [work_item, result_or_null].
          rows = []
          for line in open('mutation-rows.jsonl'):
              line = line.strip()
              if not line:
                  continue
              parsed = json.loads(line)
              if isinstance(parsed, list) and len(parsed) == 2 and isinstance(parsed[1], dict):
                  rows.append(parsed[1])
          total = len(rows)
          killed = sum(1 for r in rows if r.get('test_outcome') == 'killed')
          if total == 0:
              print('::error::No mutants produced — config error, not a pass.')
              sys.exit(1)
          rate = killed / total
          print(f'Mutation kill rate: {killed}/{total} = {rate:.1%}')
          if rate < 0.90:
              print(f'::error::Mutation kill rate {rate:.1%} below the 90% gate. Survivors:')
              for r in rows:
                  if r.get('test_outcome') != 'killed':
                      print(f'  - {r}')
              sys.exit(1)
          print('Mutation gate passed (>=90%)')
          "

      - name: Upload mutation report
        if: always() && steps.changed.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-pr-${{ github.event.pull_request.number }}
          path: |
            session-*.sqlite
            mutation-rows.jsonl
            mutation-targets.tsv

  mutation-nightly:
    name: Mutation testing (full sweep nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-extras

      - name: Write cosmic-ray.toml for the full load-bearing substrate
        run: |
          cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "packages/maistro-core/src/maistro"
          timeout = 60.0
          # "maistro.maistro-canvas" / "maistro.maistro-turing" were removed:
          # neither is a submodule of maistro-core (both are separate top-level
          # packages) nor a legal Python module path, so both excluded nothing.
          # The PR job's list at :62 never carried them, so the two configs also
          # silently disagreed.
          excluded-modules = ["maistro.tools.pm_stubs", "maistro.skills", "maistro.tools.sandbox", "maistro.tools.git"]
          test-command = "env PYTHONPATH=packages/maistro-core/src python -m pytest packages/maistro-core/tests --timeout=20 -q"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 8
          EOF

      - name: cosmic-ray full sweep
        run: |
          uv run cosmic-ray init cosmic-ray.toml session-nightly.sqlite
          uv run cosmic-ray exec cosmic-ray.toml session-nightly.sqlite
          uv run cosmic-ray dump session-nightly.sqlite > mutation-nightly.json

      - name: Project-wide mutation dashboard
        run: |
          uv run python -c "
          import json
          from collections import defaultdict
          # cosmic-ray dump prints one JSON array per line: [work_item_dict, result_dict_or_null].
          per_module = defaultdict(lambda: {'total': 0, 'killed': 0})
          for line in open('mutation-nightly.json'):
              line = line.strip()
              if not line: continue
              parsed = json.loads(line)
              if not (isinstance(parsed, list) and len(parsed) == 2): continue
              work_item, result = parsed
              if not isinstance(result, dict): continue
              mutations = work_item.get('mutations') or []
              mod = mutations[0].get('module_path', 'unknown') if mutations else 'unknown'
              per_module[mod]['total'] += 1
              if result.get('test_outcome') == 'killed':
                  per_module[mod]['killed'] += 1
          print('# Mutation kill rate (nightly)')
          for mod, stats in sorted(per_module.items()):
              rate = stats['killed']/stats['total'] if stats['total'] else 0
              flag = '⚠️ ' if rate < 0.9 else '✅ '
              print(f'{flag}{mod}: {stats[\"killed\"]}/{stats[\"total\"]} = {rate:.1%}')
          " | tee mutation-dashboard.md

      - name: Upload nightly mutation report + dashboard
        uses: actions/upload-artifact@v4
        with:
          name: mutation-nightly-${{ github.run_id }}
          path: |
            session-nightly.sqlite
            mutation-nightly.json
            mutation-dashboard.md
