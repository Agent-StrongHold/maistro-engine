# Mutation testing (cosmic-ray) — Pillar 4 of the QA gate.
#
# Gate: mutation_viability.py's viability-adjusted kill rate must clear 90% on
# every file the PR changed.
#
#   - PR -> any branch (main/integration/develop) : every changed production
#     Python file across ALL packages is mutated, no cap
#     (MUTATION_FILE_CAP: '0') — a per-file budget that silently widened to
#     the whole suite is how this job used to time out. Any file that fails to
#     resolve a test scope is named explicitly in the log — never silently
#     dropped.
#   - Nightly : one rotating four-shard batch across the full codebase
#     (mutation-nightly-full below). The reviewed per-file baseline
#     (quality/mutation-baseline.json) is built from these shards' output.
#
# Surviving mutants are tracked in docs/MUTATION-SURVIVORS.md and are
# treated as defects (test missed a real regression).

name: mutation

on:
  pull_request:
    branches: [main, integration, develop]
    paths:
      - 'packages/**/*.py'
  schedule:
    - cron: "0 6 * * *"   # nightly 06:00 UTC
  workflow_dispatch:
    inputs:
      shard_start:
        description: "First shard to run (0-31)"
        required: false
        default: "0"
        type: string
      shard_count:
        description: "Number of consecutive shards to run (1-4)"
        required: false
        default: "4"
        type: string

# See the rationale in ci.yml. This workflow is the biggest single consumer of
# runner capacity — sampled shards have run for over five hours (shard 31:
# 06:20→12:03, shard 29: 14:20→16:55), so without superseding, two pushes an
# hour apart leave both fleets of shards running against each other.
#
# The nightly sweep and workflow_dispatch runs fall to `github.ref` with
# `cancel-in-progress` false, so a full baseline sweep is never interrupted.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-pr:
    name: Mutation testing on changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Every changed production module is mutated. The nightly job establishes
    # the full-codebase baseline; this job prevents PR-local regressions.
    timeout-minutes: 360
    env:
      MUTATION_FILE_CAP: '0'
      # Via env, not inlined into the run script: a branch name interpolated
      # straight into shell is an injection seam, and this one is
      # attacker-influenced on fork PRs.
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the changed-file ratchet is initialized
        id: baseline
        run: |
          if python -c "import json; print(bool(json.load(open('quality/mutation-baseline.json'))['entries']))" | grep -qx True; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No reviewed mutation baseline yet; changed-file gate deferred to sampled shard."
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.baseline.outputs.ready == 'true'
      - run: uv python install 3.12
        if: steps.baseline.outputs.ready == 'true'
      - run: uv sync --locked --all-extras
        if: steps.baseline.outputs.ready == 'true'
      # Hive Conductor is not a workspace package, so `uv sync` above doesn't
      # cover it. The `packages/**/*.py` trigger above can resolve a changed
      # file to `packages/hive-conductor/backend/tests`, whose BDD suite needs
      # pytest_bdd from the backend's own requirements — matches the same
      # install the sharded nightly job below already carries.
      - name: Install Hive Conductor backend test dependencies
        if: steps.baseline.outputs.ready == 'true'
        run: uv pip install -r packages/hive-conductor/backend/requirements.txt

      - name: Identify every changed production Python file
        id: changed
        if: steps.baseline.outputs.ready == 'true'
        run: |
          # Diff against the PR's OWN base, not a hardcoded origin/main. This
          # workflow also runs for PRs into develop/integration, where
          # `origin/main...HEAD` reports everything the base branch carries
          # beyond main as though this PR had changed it. Measured on this very
          # PR: 0 files under these subtrees vs origin/develop, 13 vs
          # origin/main. With a 4-file cap that meant the budget was spent
          # mutating inherited code the PR never touched, and the gate then
          # reported a pass that said nothing about the change under review —
          # the precise phantom-gate shape this workflow exists to remove.
          git fetch --no-tags --depth=0 origin "$BASE_REF" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_REF"
          # --diff-filter=ACMR excludes deletions: Cosmic Ray needs a source
          # file, and a deleted module whose test directory survives would
          # otherwise resolve happily and hand cosmic-ray a module-path that
          # is not there. Test paths are INCLUDED, not stripped:
          # `mutation_targets.py`'s expand()/sources_for_test() map a changed
          # test path back to the source file(s) it covers, so a test-only PR
          # still produces a mutation target instead of silently no-op'ing.
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- packages \
            | grep '\.py$' | grep -v '__pycache__' || true)
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No production Python files changed; skipping mutation test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve every changed file to its package test scope
        id: targets
        if: steps.baseline.outputs.ready == 'true' && steps.changed.outputs.skip != 'true'
        run: |
          # Default 4, NOT 0. If the `github.base_ref` expression ever yields
          # empty (an event type that doesn't set it), `:-0` would mean "no
          # cap" and put the job straight back into the 30-minute timeout it
          # was rewritten to escape. Degrade toward the bounded run: a capped
          # sweep that finishes and says what it skipped beats an uncapped one
          # that gets killed and reports nothing.
          echo "Base branch: '${{ github.base_ref }}' — file cap: ${MUTATION_FILE_CAP:-4} (0 = full sweep)"
          uv run python scripts/mutation_targets.py \
            "${{ steps.changed.outputs.files }}" \
            > mutation-targets.tsv
          echo "Resolved targets:"; cat mutation-targets.tsv
          if [ ! -s mutation-targets.tsv ]; then
            echo "::error::No changed file resolved to a scoped test path."
            exit 1
          fi

      # A broken test command makes EVERY mutant look killed — cosmic-ray reads
      # any nonzero exit as "the tests caught it", so a usage error is
      # indistinguishable from a real kill and the gate reports a vacuous 100%.
      # That was live: `--timeout=` needs pytest-timeout, which nothing in this
      # job installed. Prove the command passes on UNMUTATED code first.
      - name: Baseline — the test command must pass before any mutant is trusted
        if: steps.baseline.outputs.ready == 'true' && steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            echo "::group::baseline $tests"
            env PYTHONPATH="$(find packages -type d -name src -printf '%p:')" uv run pytest "$tests" \
              --timeout=15 -q -x
            echo "::endgroup::"
          done < mutation-targets.tsv

      - name: cosmic-ray per changed file + aggregate gate
        if: steps.baseline.outputs.ready == 'true' && steps.changed.outputs.skip != 'true'
        run: |
          set -uo pipefail
          : > mutation-rows.jsonl
          : > mutation-sessions.tsv
          while IFS=$'\t' read -r src tests; do
            [ -z "$src" ] && continue
            echo "::group::mutate $src (tests: $tests)"
            cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "$src"
          timeout = 30.0
          excluded-modules = []
          test-command = "env PYTHONPATH=$(find packages -type d -name src -printf '%p:') python -m pytest $tests --timeout=15 -q -x"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 4
          EOF
            session="session-$(echo "$src" | tr '/.' '__').sqlite"
            rm -f "$session"
            uv run cosmic-ray init cosmic-ray.toml "$session"
            uv run cosmic-ray exec cosmic-ray.toml "$session"
            uv run cosmic-ray dump "$session" >> mutation-rows.jsonl
            printf '%s\t%s\n' "$session" "$src" >> mutation-sessions.tsv
            echo "::endgroup::"
          done < mutation-targets.tsv

          # Scoring uses scripts/mutation_viability.py's gate mode (tested in
          # tests/test_mutation_viability.py), not a raw killed/total ratio:
          # that denominator is not all killable -- an operator swap inside a
          # type annotation cannot change behaviour in a module carrying
          # `from __future__ import annotations`, because annotations are never
          # evaluated there. cosmic-ray cannot mark those INCOMPETENT -- that
          # status is for mutants which fail to compile, and these compile
          # fine -- so they sat in the survivor list permanently. Measured on
          # graph/durable_runs/executor.py: 66 of 139 survivors, enough to hold
          # a fully-tested file ~7 points under the gate no matter what anyone
          # wrote.
          #
          # Only provably non-viable mutants are subtracted, each one named in
          # the log. Mutants that fail to compile, and mutants the classifier
          # could not reconstruct, stay in the denominator -- a parse failure in
          # our own tooling must never loosen this gate. The per-shard
          # baseline-ratchet (scripts/check_mutation_baseline.py) is the
          # nightly job's mechanism for tracking reviewed per-file rates over
          # time; it does not replace this PR-time viability-adjusted gate.
          uv run python scripts/mutation_viability.py \
            --sessions mutation-sessions.tsv \
            --threshold 0.90 \
            --json mutation-gate.json

      - name: Upload mutation report
        if: always() && steps.baseline.outputs.ready == 'true' && steps.changed.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-pr-${{ github.event.pull_request.number }}
          path: |
            session-*.sqlite
            mutation-rows.jsonl
            mutation-targets.tsv
            mutation-sessions.tsv
            mutation-gate.json

  mutation-nightly:
    name: Mutation testing (full sweep nightly)
    # Superseded by the sharded all-package sweep below. Kept temporarily so
    # prior run links remain recognizable, but never scheduled again.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras

      - name: Write cosmic-ray.toml for the full load-bearing substrate
        run: |
          cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "packages/maistro-core/src/maistro"
          timeout = 60.0
          # "maistro.maistro-canvas" / "maistro.maistro-turing" were removed:
          # neither is a submodule of maistro-core (both are separate top-level
          # packages) nor a legal Python module path, so both excluded nothing.
          # The PR job's list at :62 never carried them, so the two configs also
          # silently disagreed.
          excluded-modules = ["maistro.tools.pm_stubs", "maistro.skills", "maistro.tools.sandbox", "maistro.tools.git"]
          test-command = "env PYTHONPATH=packages/maistro-core/src python -m pytest packages/maistro-core/tests --timeout=20 -q"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 8
          EOF

      - name: cosmic-ray full sweep
        run: |
          uv run cosmic-ray init cosmic-ray.toml session-nightly.sqlite
          uv run cosmic-ray exec cosmic-ray.toml session-nightly.sqlite
          uv run cosmic-ray dump session-nightly.sqlite > mutation-nightly.json

      - name: Project-wide mutation dashboard
        run: |
          uv run python -c "
          import json
          from collections import defaultdict
          # cosmic-ray dump prints one JSON array per line: [work_item_dict, result_dict_or_null].
          per_module = defaultdict(lambda: {'total': 0, 'killed': 0})
          for line in open('mutation-nightly.json'):
              line = line.strip()
              if not line: continue
              parsed = json.loads(line)
              if not (isinstance(parsed, list) and len(parsed) == 2): continue
              work_item, result = parsed
              if not isinstance(result, dict): continue
              mutations = work_item.get('mutations') or []
              mod = mutations[0].get('module_path', 'unknown') if mutations else 'unknown'
              per_module[mod]['total'] += 1
              if result.get('test_outcome') == 'killed':
                  per_module[mod]['killed'] += 1
          print('# Mutation kill rate (nightly)')
          for mod, stats in sorted(per_module.items()):
              rate = stats['killed']/stats['total'] if stats['total'] else 0
              flag = '⚠️ ' if rate < 0.9 else '✅ '
              print(f'{flag}{mod}: {stats[\"killed\"]}/{stats[\"total\"]} = {rate:.1%}')
          " | tee mutation-dashboard.md

      - name: Upload nightly mutation report + dashboard
        uses: actions/upload-artifact@v4
        with:
          name: mutation-nightly-${{ github.run_id }}
          path: |
            session-nightly.sqlite
            mutation-nightly.json
            mutation-dashboard.md

  mutation-shard-plan:
    name: Plan mutation batch
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            start=$((PR_NUMBER % 32))
            count=1
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            start=$(( (10#$(date -u +%j) % 8) * 4 ))
            count=4
          else
            start="${SHARD_START:-0}"
            count="${SHARD_COUNT:-4}"
          fi
          python - "$start" "$count" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          start, count = map(int, sys.argv[1:])
          if not 0 <= start < 32 or not 1 <= count <= 4 or start + count > 32:
              raise SystemExit("shard_start must be 0-31 and shard_count must be 1-4 without crossing 31")
          print(f"shards={json.dumps(list(range(start, start + count)))}")
          PY

  mutation-nightly-full:
    name: Mutation testing (sampled codebase shard ${{ matrix.shard }})
    needs: mutation-shard-plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-shard-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      # Hive Conductor is not a workspace package. Its BDD test dependency is
      # declared in the backend requirements, not the root uv environment.
      - name: Install Hive Conductor backend test dependencies
        run: uv pip install -r packages/hive-conductor/backend/requirements.txt

      - name: Resolve this shard's complete source inventory
        run: |
          uv run python scripts/mutation_targets.py --all > mutation-targets-all.tsv
          awk '((NR - 1) % 32) == ${{ matrix.shard }}' mutation-targets-all.tsv > mutation-targets.tsv
          test -s mutation-targets.tsv
          cat mutation-targets.tsv

      - name: Baseline each unmutated test command
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r _ tests; do
            env PYTHONPATH="$(find packages -type d -name src -printf '%p:')" uv run pytest "$tests" --timeout=20 -q -x
          done < mutation-targets.tsv

      - name: Mutate every source in this shard
        run: |
          set -euo pipefail
          : > mutation-rows-${{ matrix.shard }}.jsonl
          while IFS=$'\t' read -r src tests; do
            cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "$src"
          timeout = 60.0
          excluded-modules = []
          test-command = "env PYTHONPATH=$(find packages -type d -name src -printf '%p:') python -m pytest $tests --timeout=20 -q -x"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 4
          EOF
            session="session-${{ matrix.shard }}-$(echo "$src" | tr '/.' '__').sqlite"
            uv run cosmic-ray init cosmic-ray.toml "$session"
            uv run cosmic-ray exec cosmic-ray.toml "$session"
            uv run cosmic-ray dump "$session" >> mutation-rows-${{ matrix.shard }}.jsonl
          done < mutation-targets.tsv

      - name: Build mergeable sampled baseline candidate
        if: success()
        run: |
          cp quality/mutation-baseline.json mutation-baseline-candidate-${{ matrix.shard }}.json
          uv run python scripts/check_mutation_baseline.py mutation-rows-${{ matrix.shard }}.jsonl \
            --baseline mutation-baseline-candidate-${{ matrix.shard }}.json --write-baseline

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-nightly-shard-${{ matrix.shard }}
          path: |
            mutation-rows-${{ matrix.shard }}.jsonl
            mutation-targets.tsv
            mutation-baseline-candidate-${{ matrix.shard }}.json
