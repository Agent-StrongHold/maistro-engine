name: PR416 docstring ratchet repair

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-durable-canonical-persistence
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras
      - name: Add missing qualified-symbol docstrings
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          targets = {
              "packages/maistro-core/tests/graph/durable_runs/test_durable_runs.py": {
                  "_resolver": "Resolve a legacy fixture node through the registered node kind.",
                  "test_resumable_pause_store_roundtrip": "Verify a resumable pause survives a durable store round trip.",
                  "_Inc": "Increment a numeric fixture value for processor execution tests.",
                  "_Inc.run": "Return the incremented fixture value.",
                  "test_node_resolver_receives_full_dag_and_can_inspect_siblings": "Verify the resolver can inspect sibling nodes in the full graph fixture.",
                  "_Inspect": "Capture graph context supplied to the processor resolver fixture.",
                  "_Inspect.run": "Return the inspected fixture payload.",
                  "_processor_resolver": "Resolve processor fixtures used by durable execution tests.",
              },
              "packages/maistro-core/tests/graph/durable_runs/test_executor_frontier_parity.py": {
                  "test_frontier_persistence_state_is_graph_scoped_not_lifecycle_ownership": "Verify persisted frontier state owns graph traversal rather than Run lifecycle.",
              },
              "packages/maistro-core/tests/graph/durable_runs/test_executor_gaps.py": {
                  "_resolver": "Resolve a node implementation for executor gap characterization tests.",
              },
              "packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py": {
                  "_resolver_for": "Build a resolver for the supplied mutant-test node implementations.",
                  "test_timeout_uses_total_wall_clock_not_two_independent_windows": "Verify timeout accounting uses one total wall-clock deadline.",
              },
              "packages/maistro-core/tests/graph/durable_runs/test_routing_parity.py": {
                  "_Resolver": "Resolve routing-parity nodes while retaining the graph supplied by execution.",
                  "_Resolver.__call__": "Return the registered node implementation for a graph node id.",
                  "test_durable_resume_re_uses_same_routing_semantics": "Verify resumed durable execution preserves canonical routing semantics.",
              },
              "packages/maistro-core/tests/graph/test_cross_domain_substrate.py": {
                  "_resolver": "Resolve cross-domain substrate fixture nodes from the canonical graph.",
              },
              "packages/maistro-core/tests/graph/test_stream5_parity_characterization.py": {
                  "_legacy_resolver": "Resolve legacy characterization fixtures for parity comparison.",
                  "_DurableFanoutFirstNode": "Record the first durable fan-out branch used by the characterization fixture.",
                  "_DurableFanoutFirstNode.run": "Return the first durable fan-out branch payload.",
                  "_resolver": "Resolve durable frontier characterization fixture nodes.",
              },
          }

          def qualified_nodes(tree: ast.AST):
              found = {}

              def visit(node: ast.AST, stack: list[str]) -> None:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      name = ".".join([*stack, node.name])
                      found[name] = node
                      child_stack = [*stack, node.name]
                      for child in node.body:
                          visit(child, child_stack)
                      return
                  for child in ast.iter_child_nodes(node):
                      visit(child, stack)

              visit(tree, [])
              return found

          for file_name, wanted in targets.items():
              path = Path(file_name)
              text = path.read_text()
              lines = text.splitlines(keepends=True)
              tree = ast.parse(text)
              found = qualified_nodes(tree)
              insertions = []
              missing = []
              for qualname, doc in wanted.items():
                  node = found.get(qualname)
                  if node is None:
                      missing.append(qualname)
                      continue
                  if ast.get_docstring(node, clean=False) is not None:
                      continue
                  if not node.body:
                      raise SystemExit(f"{file_name}:{qualname} has no body")
                  first = node.body[0]
                  indent = " " * first.col_offset
                  insertions.append((first.lineno - 1, f'{indent}"""{doc}"""\n'))
              if missing:
                  raise SystemExit(f"{file_name}: missing qualified symbols {missing}")
              for index, content in sorted(insertions, reverse=True):
                  lines.insert(index, content)
              path.write_text("".join(lines))
          PY
      - name: Format and lint touched tests
        run: |
          uv run ruff format \
            packages/maistro-core/tests/graph/durable_runs/test_durable_runs.py \
            packages/maistro-core/tests/graph/durable_runs/test_executor_frontier_parity.py \
            packages/maistro-core/tests/graph/durable_runs/test_executor_gaps.py \
            packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py \
            packages/maistro-core/tests/graph/durable_runs/test_routing_parity.py \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py \
            packages/maistro-core/tests/graph/test_stream5_parity_characterization.py
          uv run ruff check \
            packages/maistro-core/tests/graph/durable_runs/test_durable_runs.py \
            packages/maistro-core/tests/graph/durable_runs/test_executor_frontier_parity.py \
            packages/maistro-core/tests/graph/durable_runs/test_executor_gaps.py \
            packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py \
            packages/maistro-core/tests/graph/durable_runs/test_routing_parity.py \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py \
            packages/maistro-core/tests/graph/test_stream5_parity_characterization.py
      - name: Run touched graph tests
        run: |
          uv run pytest -q \
            packages/maistro-core/tests/graph/durable_runs \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py \
            packages/maistro-core/tests/graph/test_stream5_parity_characterization.py
      - name: Commit docstrings
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/tests/graph
          git commit -m "test(graph): document canonical durable fixtures"
          git push origin HEAD:feat/graph-durable-canonical-persistence
