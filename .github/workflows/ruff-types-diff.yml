name: ruff-types-diff

on:
  pull_request:
    branches: [develop]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - name: Show exact Ruff format diff
        run: |
          uv run ruff format --diff packages/maistro-core/src/maistro/graph/durable_runs/types.py
          exit 1
