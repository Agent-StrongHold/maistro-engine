name: One-shot promotion dependency repair

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fix-promotion-gates
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Raise remaining cryptography compatibility ranges
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('packages/hive-conductor/pyproject.toml'): (
                  '"cryptography>=43.0.0,<49"',
                  '"cryptography>=50.0.0,<51"',
              ),
              Path('packages/hive-conductor/backend/requirements.txt'): (
                  'cryptography>=43.0.0,<49',
                  'cryptography>=50.0.0,<51',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected constraint not found in {path}: {old}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerate Python lock for audited packages
        run: uv lock --upgrade-package aiohttp --upgrade-package cryptography --upgrade-package gitpython
      - name: Repair high-severity canvas npm advisories
        working-directory: packages/maistro-canvas/frontend
        run: npm audit fix --audit-level=high
      - name: Verify lock and audits
        run: |
          uv lock --check
          uv sync --locked --extra dev
          uv pip freeze --exclude-editable > /tmp/deps.txt
          uvx pip-audit --strict -r /tmp/deps.txt
          cd packages/maistro-canvas/frontend
          npm audit --audit-level=high
      - name: Remove one-shot scaffolding and commit generated changes
        run: |
          rm -f .github/workflows/ci-fix-promotion-gates.yml placeholder.tmp placeholder2.tmp
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ci): update vulnerable Python and npm dependencies'
          git push origin HEAD:ci/fix-promotion-gates
