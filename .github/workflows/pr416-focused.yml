name: PR416 focused durable validation

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-durable-canonical-persistence
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras
      - name: Apply safe import-order fixes
        run: |
          uv run ruff check --select I001 --fix \
            packages/maistro-core/tests/graph/durable_runs/test_durable_runs.py \
            packages/maistro-core/tests/graph/nodes/test_rsi_quota_pace_trigger.py \
            packages/maistro-core/tests/graph/seeds/test_seeds.py \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py
          uv run ruff format \
            packages/maistro-core/tests/graph/durable_runs/test_durable_runs.py \
            packages/maistro-core/tests/graph/nodes/test_rsi_quota_pace_trigger.py \
            packages/maistro-core/tests/graph/seeds/test_seeds.py \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py
      - name: Validate focused durable slice
        run: |
          uv run ruff check .
          uv run pytest -q \
            packages/maistro-core/tests/graph/durable_runs \
            packages/maistro-core/tests/graph/test_stream5_parity_characterization.py \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py \
            packages/maistro-core/tests/graph/seeds/test_seeds.py \
            packages/maistro-core/tests/graph/nodes/test_rsi_quota_pace_trigger.py
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/tests/graph
          git commit -m "style(graph): apply canonical test import ordering"
          git push origin HEAD:feat/graph-durable-canonical-persistence
