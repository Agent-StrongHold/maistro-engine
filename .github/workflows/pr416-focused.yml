name: PR416 focused durable validation

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras
      - name: Ruff diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          uv run ruff check \
            packages/maistro-core/src/maistro/graph/durable_runs \
            packages/maistro-core/tests/graph/_canonical_helpers.py \
            packages/maistro-core/tests/graph/durable_runs \
            packages/maistro-core/tests/graph/test_stream5_parity_characterization.py \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py \
            packages/maistro-core/tests/graph/seeds/test_seeds.py \
            packages/maistro-core/tests/graph/nodes/test_rsi_quota_pace_trigger.py \
            2>&1 | tee ruff-pr416.txt
      - name: Focused canonical durable tests
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest -vv --tb=short \
            packages/maistro-core/tests/graph/durable_runs \
            packages/maistro-core/tests/graph/test_stream5_parity_characterization.py \
            packages/maistro-core/tests/graph/test_cross_domain_substrate.py \
            packages/maistro-core/tests/graph/seeds/test_seeds.py \
            packages/maistro-core/tests/graph/nodes/test_rsi_quota_pace_trigger.py \
            2>&1 | tee pytest-pr416.txt
      - name: Core suite collection count
        if: always()
        run: uv run pytest --collect-only -q packages/maistro-core/tests | tail -n 5
      - name: Upload PR416 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr416-diagnostics
          path: |
            ruff-pr416.txt
            pytest-pr416.txt
