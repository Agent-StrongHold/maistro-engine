name: Formal Conformance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: formal-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e formal/

      - name: Install maistro-core
        run: pip install -e packages/maistro-core

      - name: Extract constants from source
        run: python -m formal.extractors.extract_security_constants

      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet -- formal/generated/; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff -- formal/generated/ > formal-models-drift.diff
          fi

      - name: Run formal models
        run: pytest formal/models/ -v --timeout=300 --hypothesis-seed=0

      - name: Upload drift diff artifact
        if: steps.drift.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formal-models-conformance-drift
          path: formal-models-drift.diff

      - name: Comment on PR (drift detected)
        if: steps.drift.outputs.drift == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Formal models conformance drift detected.',
              '',
              'The extracted constants (`formal/generated/security-constants.json`) do not match this PR.',
              'Run `python -m formal.extractors.extract_security_constants` locally and commit the updated file.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
