name: PR 447 Core Diagnostic

on:
  push:
    branches:
      - fix/develop-traversal-commit-lint

permissions:
  contents: read

jobs:
  core-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra bootstrap
      - name: Run maistro-core tests and retain output
        id: core-tests
        shell: bash
        run: |
          set +e
          uv run pytest packages/maistro-core/tests -v --tb=short --junitxml=core-tests.xml 2>&1 | tee core-tests.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Annotate maistro-core failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path("core-tests.log").read_text().splitlines()
          interesting = [
              line for line in lines
              if line.startswith(("FAILED ", "ERROR "))
              or " short test summary info " in line
              or line.startswith("E   ")
          ]
          if not interesting:
              print("::notice title=CoreTests::No failure summary lines found")
          for line in interesting:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=CoreTests::{escaped}")
          PY
      - name: Upload maistro-core diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr447-core-diagnostic
          path: |
            core-tests.log
            core-tests.xml
          if-no-files-found: error
      - name: Preserve test result
        if: always()
        run: exit "${{ steps.core-tests.outputs.status }}"
