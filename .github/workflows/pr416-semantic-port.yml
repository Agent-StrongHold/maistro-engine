name: PR416 canonical test semantic port

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-durable-canonical-persistence
      - name: Finish canonical test assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          seed = Path('packages/maistro-core/tests/graph/seeds/test_seeds.py')
          text = seed.read_text()
          text = text.replace('    run_durable_dag,\n', '')
          text = text.replace('.node_records', '.node_runs')
          text = text.replace('.output', '.result')
          text = text.replace(
              'f"error={result.error_code}/{result.error_message}, "\n        f"records={[(nr.node_id, nr.phase, nr.error_code) for nr in result.node_runs]}"',
              'f"error={result.run.error}, "\n        f"records={[(nr.node_id, nr.status, nr.error) for nr in result.node_runs]}"',
          )
          seed.write_text(text)

          cross = Path('packages/maistro-core/tests/graph/test_cross_domain_substrate.py')
          text = cross.read_text()
          text = text.replace('run_durable_dag` executor', 'canonical durable Graph executor')
          cross.write_text(text)
          PY
      - name: Commit semantic port
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/tests/graph
          git commit -m "test(graph): finish canonical durable test assertions"
          git push origin HEAD:feat/graph-durable-canonical-persistence
