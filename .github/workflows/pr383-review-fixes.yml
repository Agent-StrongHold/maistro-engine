name: PR 383 review remediation

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/pr383-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply review fixes
        run: python scripts/pr383_review_fixes.py

      - name: Validate patched syntax and whitespace
        run: |
          python -m py_compile \
            packages/maistro-core/src/maistro/state.py \
            packages/maistro-core/src/maistro/graph/durable_runs/executor.py \
            packages/maistro-evolve/src/maistro_evolve/benchmarks/sandbox_exec.py \
            packages/maistro-evolve/src/maistro_evolve/benchmarks/swebench.py \
            packages/hive-conductor/backend/middleware/auth.py \
            packages/hive-conductor/backend/routes/workspaces.py \
            packages/hive-conductor/backend/routes/health.py
          node --check packages/maistro-canvas/frontend/server.js
          node --check packages/maistro-canvas/frontend/server/security.js
          git diff --check

      - name: Remove one-shot remediation scaffolding
        run: |
          rm scripts/pr383_review_fixes.py
          rm .github/workflows/pr383-review-fixes.yml

      - name: Commit fixes to develop
        run: |
          git config user.name "maistro-review-fix"
          git config user.email "maistro-review-fix@users.noreply.github.com"
          git add -A
          git commit -m "fix: address develop promotion review findings"
          git push origin HEAD:develop
