name: PR 383 review remediation final

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/pr383-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create remediation branch
        run: git checkout -b fix/pr383-review-remaining

      - name: Apply final review fixes
        run: python scripts/pr383_review_fixes.py

      - name: Validate patched syntax and whitespace
        run: |
          python -m py_compile packages/hive-conductor/backend/routes/workspaces.py
          node --check packages/maistro-canvas/frontend/server/security.js
          git diff --check

      - name: Remove one-shot remediation scaffolding
        run: |
          rm scripts/pr383_review_fixes.py
          rm .github/workflows/pr383-review-fixes.yml

      - name: Commit and push remediation branch
        run: |
          git config user.name "maistro-review-fix"
          git config user.email "maistro-review-fix@users.noreply.github.com"
          git add -A
          git commit -m "fix: address final develop promotion review findings"
          git push origin HEAD:fix/pr383-review-remaining
