name: tmp-interrogate-diagnostic
on:
  push:
    branches: [feat/graph-frontier-execution]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - run: uv python install 3.12
      - run: |
          uv sync --locked --all-extras
          uv pip install interrogate
      - name: Document durable frontier contracts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('packages/maistro-core/src/maistro/graph/durable_runs/executor.py')
          source = path.read_text()
          tree = ast.parse(source)
          docs = {
              '_FrontierItem': 'Bind one active frontier node to its canonical NodeRun and execution inputs.',
              '_replace_state': 'Return a GraphExecutionState with only the requested fields replaced.',
              '_replace_record': 'Return a durable record with selected canonical state replaced.',
              '_checkpoint': 'Persist the durable record and return the stored optimistic version.',
              '_new_run': 'Create the canonical Run and initial GraphExecutionState for a graph launch.',
              'run_durable_graph': 'Start and execute a durable graph from its canonical entry frontier.',
              'resume_durable_graph': 'Resume execution of a previously persisted durable graph run.',
              '_execute_frontier': 'Execute all prepared frontier nodes concurrently against one persisted snapshot.',
              '_classify_frontier_results': 'Terminalize frontier NodeRuns and partition their results by outcome.',
              '_route_completed_items': 'Collect deterministic successor targets and immutable edge decisions.',
              '_blackboard_halt_reason': 'Return the graph halt reason encoded in the current blackboard, if any.',
              '_deferred_frontier': 'Read the ordered deferred frontier from persisted graph state.',
              '_deferred_fanins': 'Read deferred fan-in node identifiers from persisted graph state.',
              '_latest_prior_node_run_ordinal': 'Find the latest completed visit ordinal before the current frontier cycle.',
              '_selected_predecessor_decisions': 'Select the latest routed predecessor decisions for one fan-in visit.',
              '_can_reach': 'Return whether one graph node can structurally reach another node.',
              '_selected_predecessor_sources': 'Return predecessor sources already selected for the target fan-in visit.',
              '_fanin_waits_for_live_branch': 'Return whether a fan-in must wait for a still-live predecessor branch.',
              '_partition_ready_targets': 'Partition successor targets into executable and deferred fan-in frontiers.',
              '_with_deferred_fanins': 'Persist the deferred fan-in set without changing unrelated traversal state.',
              '_checkpoint_paused_frontier': 'Persist paused siblings together with successors deferred until resume.',
              '_checkpoint_next_frontier': 'Persist the next executable frontier and advance the traversal cycle.',
              '_dedupe': 'Deduplicate node identifiers while preserving deterministic encounter order.',
              '_is_human_pause': 'Return whether a node result represents a human-in-the-loop pause.',
              '_pause_entry': 'Build persisted pause metadata for one waiting frontier NodeRun.',
              '_earliest_resume': 'Return the earliest resumable timestamp among paused frontier members.',
              '_finish_walk': 'Terminalize graph traversal when no executable or deferred frontier remains.',
              '_entry_node': 'Resolve the canonical graph entry node identifier.',
              '_node_spec': 'Resolve the immutable node specification for a graph node identifier.',
              '_latest_nonterminal_node_run_index': 'Find the latest unfinished canonical NodeRun for a graph node.',
              '_ensure_frontier_node_runs': 'Resume or create one canonical running NodeRun per frontier member.',
              '_value_at_path': 'Resolve a dotted data path against nested mapping values.',
              '_predicate_namespace': 'Build the predicate namespace exposed to conditional edge evaluation.',
              '_completed_predicate_state': 'Build predicate state from previously completed NodeRun outputs.',
              '_merge_current_predicate_state': 'Overlay current-frontier results onto prior predicate state.',
              '_predicate_state': 'Build the complete deterministic predicate state for edge routing.',
              '_result_value': 'Extract the value used by result-based edge conditions.',
              '_result_matches_condition': 'Evaluate a result comparison condition against one node outcome.',
              '_edge_parallel': 'Return whether an edge participates in parallel fan-out routing.',
              '_next_node': 'Return the first selected sequential successor for compatibility callers.',
              '_initial_inputs': 'Return the immutable launch inputs recorded for the graph run.',
              '_merge_changed_mapping': 'Merge only mapping values changed by a completed frontier member.',
              '_actually_spawned': 'Return whether a node result represents a successful synthetic spawn.',
              '_maybe_increment_synth_depth': 'Increment synthesis depth only when the node actually spawned work.',
              '_build_ctx': 'Build the runtime execution context for one canonical NodeRun.',
              '_replace_node_run': 'Return a NodeRun with selected lifecycle or result fields replaced.',
              '_result_output': 'Normalize a node execution result into its persisted output mapping.',
              '_clear_pause_metadata': 'Remove pause metadata after the corresponding frontier has resumed.',
              '_mark_completed': 'Terminalize a successful NodeRun and persist its normalized output.',
              '_running_run': 'Return the parent Run in its canonical running lifecycle state.',
              '_cancel_unfinished_node_runs': 'Terminalize every unfinished sibling NodeRun when the parent run fails.',
              '_mark_failed': 'Terminalize the parent Run and reconcile unfinished NodeRuns after failure.',
          }
          lines = source.splitlines(keepends=True)
          inserts = []
          for node in ast.walk(tree):
              if not isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              doc = docs.get(node.name)
              if doc is None or ast.get_docstring(node, clean=False) is not None or not node.body:
                  continue
              first = node.body[0]
              indent = ' ' * first.col_offset
              inserts.append((first.lineno - 1, f'{indent}"""{doc}"""\n'))
          for index, text in sorted(inserts, reverse=True):
              lines.insert(index, text)
          path.write_text(''.join(lines))
          print(f'inserted {len(inserts)} docstrings')
          if len(inserts) < 32:
              raise SystemExit('unexpectedly few docstrings inserted')
          PY
      - name: Format and verify
        run: |
          uv run ruff format packages/maistro-core/src/maistro/graph/durable_runs/executor.py
          uv run ruff check packages/maistro-core/src/maistro/graph/durable_runs/executor.py
          uv run interrogate -f 45 packages/maistro-core/src/maistro/graph/durable_runs
      - name: Remove repair workflow and commit
        run: |
          rm .github/workflows/tmp-interrogate-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/maistro-core/src/maistro/graph/durable_runs/executor.py .github/workflows/tmp-interrogate-diagnostic.yml
          git commit -m "docs: document durable frontier contracts"
          git push
