name: tmp-interrogate-diagnostic
on:
  push:
    branches: [feat/graph-frontier-execution]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - run: uv python install 3.12
      - run: |
          uv sync --locked --all-extras
          uv pip install interrogate
      - name: Detailed durable-run docstring report
        run: uv run interrogate -vv packages/maistro-core/src/maistro/graph/durable_runs
