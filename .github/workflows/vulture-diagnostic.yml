name: Vulture Diagnostic

on:
  push:
    branches:
      - feat/execution-runtime-spine-373

permissions:
  contents: read

jobs:
  changed-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: uv sync --locked --extra dev
      - name: Annotate Vulture findings in changed production files
        env:
          BASE_REF: origin/develop
        run: |
          uv run vulture packages/*/src --min-confidence 60 \
            --exclude '*/third_party/*' > /tmp/vulture.log 2>&1 || true
          git diff --name-only "$BASE_REF"...HEAD -- 'packages/*/src/**.py' > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path

          changed = set(Path('/tmp/changed.txt').read_text().splitlines())
          findings = []
          for line in Path('/tmp/vulture.log').read_text().splitlines():
              path, sep, rest = line.partition(':')
              if sep and path in changed:
                  findings.append(line)
          print(f"Changed-file Vulture findings: {len(findings)}")
          for finding in findings:
              escaped = finding.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::warning::{escaped}")
          PY
