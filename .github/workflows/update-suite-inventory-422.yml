name: update-suite-inventory-422

on:
  push:
    branches: [feat/attempt-result-acceptance]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attempt-result-acceptance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev --extra bootstrap
      - name: Regenerate suite inventory
        run: python scripts/check-suite-inventory.py --suite packages/maistro-core/tests --update
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - name: Commit regenerated inventory
        run: |
          set -euo pipefail
          git diff --check
          git diff -- docs/testing/SUITE-INVENTORY.md
          if git diff --quiet -- docs/testing/SUITE-INVENTORY.md; then
            echo "Inventory already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/SUITE-INVENTORY.md
          git commit -m "test: refresh #422 suite inventory"
          git push origin HEAD:feat/attempt-result-acceptance
