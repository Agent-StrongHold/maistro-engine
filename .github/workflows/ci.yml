name: CI

on:
  push:
    branches: [main, integration, develop, merge/main-into-integration]
  pull_request:
    branches: [main, integration, develop]

# Supersede in-flight runs for the same PR instead of letting them pile up.
# Every push to a PR previously left the prior run's jobs burning runners —
# including this workflow's own 20-minute `hive-conductor-e2e-ui` — which is
# what left later jobs sitting `queued` for tens of minutes.
#
# Cancellation is scoped to pull_request on purpose: pushes to main/integration/
# develop must run to completion, because ADR-095's branch model relies on
# knowing whether a given commit on a protected branch was green. A cancelled
# run reports neither success nor failure, so cancelling those would erase that
# record rather than just saving time.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - run: bash scripts/verify-monorepo-layout.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Type-check EVERY package's src (no cherry-picking): a gate that skips
      # packages lets type errors accumulate unseen in the skipped ones.
      - run: >-
          uv run mypy
          packages/maistro-core/src
          packages/maistro-server/src
          packages/maistro-turing/src
          packages/maistro-canvas/src
          packages/maistro-bootstrap/src
          packages/maistro-registry/src
          packages/maistro-evolve/src
          packages/maistro-rsi/src
          packages/maistro-design/src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: |
          set -e
          sudo apt-get update || true
          sudo apt-get install -y age || true
          if ! command -v age-keygen &> /dev/null; then
            echo "Installing age-keygen from source..."
            mkdir -p /tmp/age && cd /tmp/age
            curl -fsSL https://dl.filippo.io/age/latest/age-linux-amd64.tar.gz | tar xz
            ls -la /tmp/age/
            sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/ || exit 1
            echo "Verifying installation..."
            age-keygen --help > /dev/null && echo "✓ age-keygen ready" || exit 1
          fi
      - run: uv sync --locked --extra dev --extra bootstrap
      - run: uv run pytest packages/maistro-bootstrap/tests -v --tb=short
      - run: uv run pytest packages/maistro-core/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-server/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-canvas/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-turing/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      # maistro-turing/backend is a second FastAPI service with its own auth
      # lanes. It MUST be its own pytest invocation: its conftest imports a
      # bare `config` module, and hive-conductor's backend/config.py shadows it
      # whenever the two share a process (ImportError: cannot import name
      # 'turing_service_key' from 'config'). Same shadowing class the
      # hive-conductor conftest already works around for `services/`.
      - run: uv run pytest packages/maistro-turing/backend/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-design/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      # Root tests/ tree. Only tests/tools/registry/ is excluded — registry.yml
      # already owns that subtree and runs it with its own --confcutdir.
      # NOT --ignore=tests/tools: pytest ignores the whole path, which would
      # leave test_env_sanitize.py, test_sandbox_paths.py and test_workspace.py
      # (80 sandbox/env-security tests) orphaned from CI — the very defect this
      # step exists to fix.
      - run: uv run pytest tests/ --ignore=tests/tools/registry -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      # maistro-rsi + maistro-evolve are workspace members (so they DO have
      # uv.lock entries as of F1/#300) but they are not root dependencies, so
      # `uv sync` above does not install them into the root env. Put their src
      # trees on PYTHONPATH — the same pattern the
      # root CLAUDE.md documents for local runs. Their third-party deps
      # (httpx, pydantic, structlog, fastmcp via the root env) are already
      # installed by `uv sync` above.
      - run: uv run pytest packages/maistro-rsi/tests packages/maistro-evolve/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
          PYTHONPATH: packages/maistro-rsi/src:packages/maistro-evolve/src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/hive-conductor/frontend/package-lock.json
            packages/maistro-canvas/frontend/package-lock.json
      # `npm run lint` existed here and no workflow ran it. Only `build` did —
      # and build is `tsc --noEmit` twice, which type-checks but says nothing
      # about dead code, swallowed errors or hook misuse. It ran clean over both
      # empty `catch {}` blocks repaired in this PR.
      #
      # Lint runs BEFORE build: it is the faster of the two and the one more
      # likely to fail, so a red run reports the cheaper failure first.
      - run: npm ci && npm run lint && npm run build
        working-directory: packages/hive-conductor/frontend
      # The canvas book-maker frontend had no CI at all — no workflow built,
      # linted or tested it — while `server.js` is a real network service that
      # proxies operator LLM credentials and shells out to python3. Its vitest
      # suite (including server/security.test.js) is the only regression net the
      # C4 hardening has, so it has to actually run somewhere.
      #
      # `test:ci` deliberately EXCLUDES tests/renderingPipeline.test.js: 10 of
      # its 11 tests fail on the current tree for reasons that predate the auth
      # work (the Azure image-edit fallback chain does not behave as the tests
      # assert, and two time out at 5s). Those are real but unrelated product
      # defects in the image pipeline. They are named here so the exclusion is
      # visible rather than implied by a green check; fixing them should delete
      # the `test:ci` script and restore plain `npm run test`.
      #
      # The script is a DENY-list, not an allow-list, and that matters: an
      # allow-list of filenames silently drops every test file added later,
      # which for a step whose entire purpose is "the canvas hardening needs a
      # regression net" is a gate that decays open without ever going red.
      - run: npm ci && npm run test:ci
        working-directory: packages/maistro-canvas/frontend
      # `lint` and `build` for canvas, neither of which any workflow ran.
      #
      # The missing `build` is not a hygiene gap — it is how a real defect
      # stayed hidden. `src/lib/api.js` exported `IMAGE_MODELS` twice, which is
      # invalid ESM. Vite tolerates it so nothing failed, but eslint could not
      # parse the file at all, leaving the entire API client unlinted; the
      # `no-undef` that exposed a `ReferenceError` in
      # `characterNormalizer.js`'s fallback path was invisible behind it.
      #
      # `lint` caps react-hooks warnings at the current 13 (see
      # eslint.config.js): those are real and deferred, and the cap means the
      # count can shrink but never grow, while every other rule fails outright.
      - run: npm run lint
        working-directory: packages/maistro-canvas/frontend
      - run: npm run build
        working-directory: packages/maistro-canvas/frontend
      # No JS dependency auditing existed anywhere, while security.yml has run
      # pip-audit for Python since day one — and `server.js` is a real network
      # service that proxies operator LLM credentials and shells out to python3.
      # The tree was carrying 7 advisories (4 high, all in vite); `npm audit
      # fix` cleared them within the existing semver ranges, so this starts at
      # zero rather than needing a baseline.
      - run: npm audit --audit-level=high
        working-directory: packages/maistro-canvas/frontend
      - run: uv pip install --system -r packages/hive-conductor/backend/requirements.txt
      - run: python -m pytest packages/hive-conductor/backend/tests -v --tb=short
      # C1/#286's remaining acceptance criterion: CI-collected node IDs must
      # match docs/testing/SUITE-INVENTORY.md. Nothing enforced that before, so
      # a suite could silently stop collecting and every job above would still
      # go green — "0 tests collected" is not a pytest failure.
      #
      # LAST step in this job on purpose: it collects EVERY suite, including
      # `packages/hive-conductor/*` under bare python, so it needs the
      # backend requirements installed by the step above. The script itself
      # only needs stdlib; it shells out to `uv run pytest` or bare
      # `python -m pytest` per suite (see its module docstring for the two
      # invocation traps it has to honor).
      - name: Suite inventory matches collected node IDs (C1/#286)
        run: python scripts/check-suite-inventory.py

  # packages/hive-conductor/tests/e2e/pm-workflow.spec.ts (Playwright UI
  # walkthrough: setup wizard -> login -> dashboard -> DAG create/run ->
  # feedback -> optimizer -> audit log) is already wired into
  # docker-compose.test.yml's `e2e-tests` service (same live-`hive`-container
  # harness the API e2e suite uses) but no workflow had ever invoked it (C2/#287).
  #
  # continue-on-error: non-blocking for now, matching the v1 plan's own note
  # that this job "may start non-blocking; blocking by G1".
  #
  # KNOWN BROKEN, AND NOT FOR THE REASON THIS COMMENT USED TO GIVE. It used to
  # blame the task-scoped permission-elevation model (middleware/auth.py's
  # _PROTECTED_OPS) making `POST /v1/dags` return 403 for the spec's DAG
  # mutation steps. The logs do not support that: ALL 12 specs fail, each at
  # exactly 1.0m (= playwright.config.ts's `timeout: 60000`), and the first is
  # `01 — Setup wizard completes on first boot`, which never touches /v1/dags.
  # A selective auth failure cannot produce a uniform timeout across specs that
  # don't make the call.
  #
  # The uniformity is explained by the spec's `beforeEach`, which calls
  # `setupIfNeeded()` -> `page.goto("/")` for every test. `goto` defaults to
  # `waitUntil: "load"`, so if that navigation never completes, every test
  # burns the full timeout before its body runs. Whether the app is unreachable,
  # or reachable but never firing `load`, is not yet established.
  #
  # It has never been established because the diagnostic step below was
  # `if: failure()` — and this job does not fail, it exceeds timeout-minutes and
  # is CANCELLED, which `failure()` does not match. The one step meant to
  # explain this has therefore never executed in any run. It is `always()` now,
  # which does match cancellation.
  #
  # Do not re-blame the auth gap without reading a log dump first.
  hive-conductor-e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Step timeout deliberately below the job's 20. A step that overruns
      # FAILS the step and leaves the job alive to run the diagnostics below
      # with headroom; letting the JOB hit timeout-minutes instead cancels it,
      # which is what kept the dump from ever running.
      - name: Run PM workflow Playwright UI e2e against a live hive-conductor
        timeout-minutes: 14
        working-directory: packages/hive-conductor
        run: |
          docker compose -f docker-compose.test.yml --profile test up --build \
            --abort-on-container-exit --exit-code-from e2e-tests e2e-tests
      # always(), not failure(): this job's characteristic outcome is a timeout,
      # and on the job-cancellation path failure() is not satisfied. See the
      # block comment above this job.
      - name: Diagnose — container state and per-service logs
        if: always()
        working-directory: packages/hive-conductor
        run: |
          echo "::group::compose ps (did hive ever start and report healthy?)"
          docker compose -f docker-compose.test.yml ps -a || true
          echo "::endgroup::"
          echo "::group::hive service logs"
          docker compose -f docker-compose.test.yml logs --no-color --tail=300 hive || true
          echo "::endgroup::"
          echo "::group::e2e-tests (playwright) logs"
          docker compose -f docker-compose.test.yml logs --no-color --tail=200 e2e-tests || true
          echo "::endgroup::"
          echo "::group::is the app reachable, and what does GET / return?"
          # The spec's beforeEach does page.goto("/") for every test; if that
          # never completes, all 12 specs burn the full per-test timeout. Probe
          # the same origin the browser uses, from inside the compose network.
          docker compose -f docker-compose.test.yml run --rm --no-deps -T \
            --entrypoint sh e2e-tests -c \
            'wget -S -T 10 -O /dev/null http://hive:8101/ 2>&1 | head -40; echo "exit=$?"' || true
          echo "::endgroup::"
      - name: Tear down
        if: always()
        working-directory: packages/hive-conductor
        run: docker compose -f docker-compose.test.yml down -v

  # packages/hive-conductor/tests/e2e/test_pm_workflow_api.py (24 tests: setup
  # wizard -> login -> create/run DAG -> feedback -> optimizer proposal ->
  # accept -> audit log) needs a LIVE hive-conductor server, not the in-process
  # TestClient the backend/tests job above uses — it was invisible to every CI
  # workflow. docker-compose.test.yml already defines the right harness (a
  # `hive` service with a /health/ready healthcheck, SQLite-backed, no external
  # DB; an `api-tests` service whose own Dockerfile installs only pytest+httpx
  # and only ever runs this one file, so the three browser_use-dependent
  # scripts in the same directory are never at risk of being picked up here) —
  # this job just invokes it.
  hive-conductor-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run PM workflow e2e against a live hive-conductor
        working-directory: packages/hive-conductor
        run: |
          # Explicit `api-tests` target: with no service argument, `docker
          # compose up` starts every service under the active profile —
          # `e2e-tests` shares the same `test` profile and would build/start
          # the (unwired, large) Playwright image too, wasting time and
          # risking a race where its stale assertions exit first and trip
          # --abort-on-container-exit before api-tests finishes. Naming the
          # target still pulls in `hive` as its declared dependency.
          docker compose -f docker-compose.test.yml --profile test up --build \
            --abort-on-container-exit --exit-code-from api-tests api-tests
      # always() for the same reason as the UI job above: a timeout cancels the
      # job rather than failing it, and failure() would skip the dump exactly
      # when it is most needed.
      - name: Dump hive logs
        if: always()
        working-directory: packages/hive-conductor
        run: |
          docker compose -f docker-compose.test.yml ps -a || true
          docker compose -f docker-compose.test.yml logs --no-color --tail=200 || true
      - name: Tear down
        if: always()
        working-directory: packages/hive-conductor
        run: docker compose -f docker-compose.test.yml down -v

  # Build every wheel and import it from a throwaway venv that has ONLY the
  # package's declared dependencies. The other jobs all run inside the root
  # `uv sync` environment, where a dev extra can supply a library that no package
  # actually declares — which is how `maistro.identity` shipped an unguarded
  # `import nacl` while every check stayed green. This job is the control that
  # closes that gap: it tests what a downstream consumer installs, not what the
  # repo's own dev environment happens to contain.
  #
  # Should be a required status check. See ADR-095 — required checks are
  # configured in GitHub settings, not in this file.
  wheel-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      # A [tool.uv.workspace] members table exists as of F1 (#300), so `uv build
      # --all-packages` would now work. The explicit loop is kept deliberately:
      # it builds exactly what is on disk under packages/, so a new package is
      # enrolled in this gate the moment it grows a pyproject.toml — without
      # also depending on someone remembering to add it to the members table.
      # It also excludes the root wheel, which is empty by design.
      - name: Build every package wheel
        run: |
          set -euo pipefail
          rm -rf dist
          for p in packages/*/; do
            [ -f "$p/pyproject.toml" ] || continue
            echo "::group::build $p"
            uv build "$p" --out-dir dist/
            echo "::endgroup::"
          done
          ls -1 dist/*.whl
      # Tier 1: no extras, documented public surface. Tier 2: widest extra,
      # every module recursively, zero tolerated failures.
      - name: Import wheels from a clean venv
        run: python scripts/verify-wheel-imports.py --dist dist/ --python 3.12

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - run: uv pip install pip-audit
      # Workspace-local editable packages aren't on PyPI — pip-audit --strict
      # refuses them, so audit the frozen third-party set only.
      - run: uv pip freeze --exclude-editable > /tmp/deps.txt
      # `|| true`: pip-audit exits non-zero when it finds anything at all. The
      # gate script decides what actually blocks, using the one shared triaged
      # allowlist that security.yml also uses.
      - run: uv run pip-audit --strict --format=json -r /tmp/deps.txt > /tmp/pip-audit.json || true
      - run: python scripts/pip_audit_gate.py /tmp/pip-audit.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maistro-engine:test .
      - run: docker build -f packages/hive-conductor/Dockerfile . -t hive-conductor:ci

  # CI configuration is the only code in this repo that nothing lints, and it
  # is the code that decides whether everything else ships. actionlint checks
  # workflow syntax, action versions and `${{ }}` expressions; with shellcheck
  # it also checks every `run:` block, which is where the non-trivial logic
  # lives (loops, heredocs, `$GITHUB_OUTPUT` writes).
  #
  # Baseline when this landed: zero findings across all ten workflows. That is
  # the point — it is a guard against future drift, not a cleanup. Worth being
  # precise about its limits: actionlint models syntax and shell, NOT intent,
  # so it does not catch a `paths:` filter that fails to match the files it
  # should. Two such trigger defects were found by hand the same week.
  #
  # Pinned tarball rather than a third-party action, matching how this repo
  # already installs `age`: one fewer action with write access to the runner.
  workflow-lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.7"
      SHELLCHECK_VERSION: "0.10.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint + shellcheck
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar xJ -C /tmp
          install -m0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /tmp/shellcheck-bin
      - name: "actionlint (with shellcheck over run: blocks)"
        run: /tmp/actionlint -no-color -oneline -shellcheck /tmp/shellcheck-bin
