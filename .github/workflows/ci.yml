name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      # Mypy is temporarily disabled. The legacy src/maistro/ tree has
      # ~200 strict-mode errors from before this CI was added, and the
      # pydantic.mypy plugin currently fails to import against current
      # mypy releases. Re-enable once typing is cleaned up under a
      # dedicated typing pass; tracked as a follow-up.
      # - run: mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install --system -e ".[dev]"
      - run: pytest tests/ -v --tb=short --cov=maistro --cov-report=term-missing
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip install -e .
      - run: pip freeze --exclude-editable > /tmp/deps.txt
      - run: pip-audit --strict -r /tmp/deps.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maistro-engine:test .
