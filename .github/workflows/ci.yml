name: CI

on:
  push:
    branches: [main, integration, develop, merge/main-into-integration]
  pull_request:
    branches: [main, integration, develop]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: bash scripts/verify-monorepo-layout.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Type-check EVERY package's src (no cherry-picking): a gate that skips
      # packages lets type errors accumulate unseen in the skipped ones.
      - run: >-
          uv run mypy
          packages/maistro-core/src
          packages/maistro-server/src
          packages/maistro-turing/src
          packages/maistro-canvas/src
          packages/maistro-bootstrap/src
          packages/maistro-registry/src
          packages/maistro-evolve/src
          packages/maistro-rsi/src
          packages/maistro-design/src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: |
          set -e
          sudo apt-get update && sudo apt-get install -y age || true
          if ! command -v age-keygen &> /dev/null; then
            echo "Installing age-keygen from source..."
            mkdir -p /tmp/age && cd /tmp/age
            curl -fsSL https://dl.filippo.io/age/latest/age-linux-amd64.tar.gz | tar xz
            ls -la /tmp/age/
            sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/ || exit 1
            echo "Verifying installation..."
            age-keygen --help > /dev/null && echo "✓ age-keygen ready" || exit 1
          fi
      - run: uv sync --extra dev --extra bootstrap
      - run: uv run pytest packages/maistro-bootstrap/tests -v --tb=short
      - run: uv run pytest packages/maistro-core/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-server/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-canvas/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-turing/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      # maistro-rsi + maistro-evolve aren't workspace-root deps (no uv.lock
      # entry), so put their src trees on PYTHONPATH — the same pattern the
      # root CLAUDE.md documents for local runs. Their third-party deps
      # (httpx, pydantic, structlog, fastmcp via the root env) are already
      # installed by `uv sync` above.
      - run: uv run pytest packages/maistro-rsi/tests packages/maistro-evolve/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
          PYTHONPATH: packages/maistro-rsi/src:packages/maistro-evolve/src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/hive-conductor/frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/hive-conductor/frontend
      - run: uv pip install --system -r packages/hive-conductor/backend/requirements.txt
      - run: python -m pytest packages/hive-conductor/backend/tests -v --tb=short

  # Build every wheel and import it from a throwaway venv that has ONLY the
  # package's declared dependencies. The other jobs all run inside the root
  # `uv sync` environment, where a dev extra can supply a library that no package
  # actually declares — which is how `maistro.identity` shipped an unguarded
  # `import nacl` while every check stayed green. This job is the control that
  # closes that gap: it tests what a downstream consumer installs, not what the
  # repo's own dev environment happens to contain.
  #
  # Should be a required status check. See ADR-095 — required checks are
  # configured in GitHub settings, not in this file.
  wheel-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      # Not `uv build --all-packages`: there is no [tool.uv.workspace] members
      # table, so that only builds the (deliberately empty) root wheel.
      - name: Build every package wheel
        run: |
          set -euo pipefail
          rm -rf dist
          for p in packages/*/; do
            [ -f "$p/pyproject.toml" ] || continue
            echo "::group::build $p"
            uv build "$p" --out-dir dist/
            echo "::endgroup::"
          done
          ls -1 dist/*.whl
      # Tier 1: no extras, documented public surface. Tier 2: widest extra,
      # every module recursively, zero tolerated failures.
      - name: Import wheels from a clean venv
        run: python scripts/verify-wheel-imports.py --dist dist/ --python 3.12

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv pip install pip-audit
      - run: uv pip freeze --exclude-editable > /tmp/deps.txt
      - run: uv run pip-audit --strict -r /tmp/deps.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maistro-engine:test .
      - run: docker build -f packages/hive-conductor/Dockerfile . -t hive-conductor:ci
