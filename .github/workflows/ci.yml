name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install --system -e ".[dev]" -e packages/maistro-core -e packages/maistro-server -e packages/maistro-canvas -e packages/maistro-turing -e packages/maistro-evolve
      - run: ruff check packages/ src/
      - run: ruff format --check packages/ src/
      - run: mypy packages/maistro-core/src packages/maistro-server/src packages/maistro-canvas/src packages/maistro-turing/src packages/maistro-evolve/src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install --system -e ".[dev]"
      # Package tests are run in separate invocations because two
      # `tests/` directories at the same depth confuse pytest's
      # rootdir auto-detection (ImportPathMismatchError on conftest.py).
      # The legacy tests/ directory at repo root is excluded pending
      # the src/maistro/ -> packages/ migration; its modules are
      # shadowed by packages/maistro-core/src/maistro/ on the
      # pythonpath, so they fail collection.
      - run: pytest packages/maistro-core/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: pytest packages/maistro-server/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: pytest packages/maistro-canvas/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip install -e .
      - run: pip freeze --exclude-editable > /tmp/deps.txt
      - run: pip-audit --strict -r /tmp/deps.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maistro-engine:test .
