name: CI

on:
  push:
    branches: [main, integration, develop, merge/main-into-integration]
  pull_request:
    branches: [main, integration, develop]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: bash scripts/verify-monorepo-layout.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run mypy
          packages/maistro-core/src
          packages/maistro-server/src
          packages/maistro-turing/src
          packages/maistro-canvas/src
          packages/maistro-bootstrap/src
          packages/maistro-registry/src
          packages/maistro-evolve/src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: |
          set -e
          sudo apt-get update && sudo apt-get install -y age || true
          if ! command -v age-keygen &> /dev/null; then
            echo "Installing age-keygen from source..."
            mkdir -p /tmp/age && cd /tmp/age
            curl -fsSL https://dl.filippo.io/age/latest/age-linux-amd64.tar.gz | tar xz
            ls -la /tmp/age/
            sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/ || exit 1
            echo "Verifying installation..."
            age-keygen --help > /dev/null && echo "✓ age-keygen ready" || exit 1
          fi
      - run: uv sync --extra dev --extra bootstrap
      - run: uv run pytest packages/maistro-bootstrap/tests -v --tb=short
      - run: uv run pytest packages/maistro-core/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-server/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-canvas/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/hive-conductor/frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/hive-conductor/frontend
      - run: uv pip install --system -r packages/hive-conductor/backend/requirements.txt
      - run: python -m pytest packages/hive-conductor/backend/tests -v --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv pip install pip-audit
      - run: uv pip freeze --exclude-editable > /tmp/deps.txt
      - run: uv run pip-audit --strict -r /tmp/deps.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maistro-engine:test .
      - run: docker build -f packages/hive-conductor/Dockerfile . -t hive-conductor:ci
