name: Temporary Bootstrap Credential Usage

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace bootstrap credential symbols
        run: |
          git grep -n -E 'load_bootstrap_credentials|shred_credentials|BOOTSTRAP_CREDENTIALS_FILENAME|MAISTRO_BOOTSTRAP_CREDENTIALS_FILE' || true
