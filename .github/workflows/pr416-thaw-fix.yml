name: PR416 thaw fix

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-durable-canonical-persistence
      - name: Normalize frozen graph-state updates
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('executor.py', 'stores.py'):
              path = Path('packages/maistro-core/src/maistro/graph/durable_runs') / name
              text = path.read_text()
              text = text.replace(
                  'from maistro.graph.execution_state import GraphEdgeDecision, GraphExecutionState',
                  'from maistro.graph.execution_state import (\n    GraphEdgeDecision,\n    GraphExecutionState,\n    thaw_json_value,\n)',
              )
              text = text.replace(
                  'from maistro.graph.execution_state import GraphExecutionState',
                  'from maistro.graph.execution_state import GraphExecutionState, thaw_json_value',
              )
              text = text.replace(
                  '    values = state.model_dump(mode="python")\n    values.update(updates)\n    return GraphExecutionState.model_validate(values)',
                  '    values = state.model_dump(mode="json")\n    values.update({key: thaw_json_value(value) for key, value in updates.items()})\n    return GraphExecutionState.model_validate(values)',
              )
              text = text.replace(
                  '    values = record.model_dump(mode="python")\n    values.update(updates)\n    return DurableRunRecord.model_validate(values)',
                  '    values = record.model_dump(mode="json")\n    values.update({key: thaw_json_value(value) for key, value in updates.items()})\n    return DurableRunRecord.model_validate(values)',
              )
              path.write_text(text)

          mutants = Path('packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py')
          text = mutants.read_text()
          text = text.replace(
              'assert _result_output(NodeResult(success=True, output=payload)) is payload',
              'assert _result_output(NodeResult(success=True, output=payload)) == payload',
          )
          text = text.replace(
              'spec = record.graph.nodes[0]',
              'spec = record.run.graph.materialize().nodes[0]',
          )
          mutants.write_text(text)
          PY
      - name: Commit thaw fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/src/maistro/graph/durable_runs packages/maistro-core/tests/graph/durable_runs/test_executor_mutants.py
          git commit -m "fix(graph): thaw frozen state before checkpoint replacement"
          git push origin HEAD:feat/graph-durable-canonical-persistence
