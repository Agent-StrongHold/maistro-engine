name: PR416 test import migration

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-durable-canonical-persistence
      - name: Migrate legacy durable test imports
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('packages/maistro-core/tests/graph')

          def edit(path: Path, replacements: list[tuple[str, str]], append_import: str | None = None) -> None:
              text = path.read_text()
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if append_import and append_import not in text:
                  marker = 'from __future__ import annotations\n'
                  text = text.replace(marker, marker + '\n' + append_import + '\n')
              if text != original:
                  path.write_text(text)

          edit(
              root / 'durable_runs/test_durable_runs.py',
              [
                  ('    resume_durable_dag,\n', ''),
                  ('    run_durable_dag,\n', ''),
              ],
              'from .._canonical_helpers import (\n    durable_record,\n    resume_legacy_dag_fixture as resume_durable_dag,\n    run_legacy_dag_fixture as run_durable_dag,\n)',
          )
          edit(
              root / 'seeds/test_seeds.py',
              [('from maistro.graph.durable_runs import InMemoryDurableRunStore, RunStatus, run_durable_dag',
                'from maistro.graph.durable_runs import InMemoryDurableRunStore, RunStatus')],
              'from .._canonical_helpers import run_legacy_dag_fixture as run_durable_dag',
          )
          edit(
              root / 'test_cross_domain_substrate.py',
              [('    run_durable_dag,\n', ''),
               ('.node_records', '.node_runs'),
               ('by_id["brief"].output', 'by_id["brief"].result'),
               ('by_id["img"].output', 'by_id["img"].result'),
               ('result.node_runs[0].output', 'result.node_runs[0].result'),
               ('result.user_id', 'result.run.actor_principal_id')],
              'from ._canonical_helpers import run_legacy_dag_fixture as run_durable_dag',
          )
          edit(
              root / 'nodes/test_rsi_quota_pace_trigger.py',
              [('    from maistro.graph.durable_runs import InMemoryDurableRunStore, run_durable_dag',
                '    from maistro.graph.durable_runs import InMemoryDurableRunStore\n    from .._canonical_helpers import run_legacy_dag_fixture as run_durable_dag')],
          )
          edit(
              root / 'durable_runs/test_executor_gaps.py',
              [('    DurableNodeRecord,\n', ''), ('    NodePhase,\n', '')],
              'from .._canonical_helpers import durable_record, graph_from_dag',
          )
          edit(
              root / 'durable_runs/test_executor_mutants.py',
              [('    DurableNodeRecord,\n', ''), ('    NodePhase,\n', '')],
              'from .._canonical_helpers import durable_record, graph_from_dag',
          )
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/tests/graph
          git commit -m "test(graph): migrate durable test imports"
          git push origin HEAD:feat/graph-durable-canonical-persistence
