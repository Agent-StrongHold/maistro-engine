name: ruff-diff

on:
  push:
    branches:
      - feat/graph-durable-canonical-persistence

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - name: Show Ruff fix diff
        run: uv run ruff check packages/maistro-core/src/maistro/graph/durable_runs/executor.py --fix --diff
