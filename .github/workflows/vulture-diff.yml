name: vulture-diff

on:
  pull_request:
    branches: [develop]

jobs:
  show-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - name: Install workspace
        run: uv sync --locked --extra dev --extra bootstrap
      - name: Show execution-state Vulture findings
        run: |
          uv run vulture packages/*/src --min-confidence 60 --exclude '*/third_party/*' > vulture.log 2>&1 || true
          grep 'execution_state.py' vulture.log || true
          echo "total=$(wc -l < vulture.log | tr -d ' ')"
